<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AZERO">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<title>AZERO — Control interno</title>
<style>
:root{
  --bg:#f4f3f1; --card:#fff; --ink:#1f2328; --muted:#8a8781; --line:#e6e3df;
  --brand:#1f2328; --accent:#e2680f; --accent2:#b9540b; --green:#177245; --red:#c0392b; --amber:#b7791f;
  --radius:10px; --shadow:0 4px 16px #1f232810;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:auto;padding:0 16px 40px}
.appbar{background:#fff;color:var(--ink);border-top:4px solid var(--accent);border-bottom:1px solid var(--line);margin:0 -16px;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.brand b{display:block;font-size:21px;font-weight:900;letter-spacing:1px;line-height:1;color:var(--ink)}
.brand span{display:block;font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-top:3px;font-weight:700}
.who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
.who b{display:block;font-size:14px;font-weight:800}
.who span{color:var(--muted);font-size:11px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:12px;cursor:pointer;padding:0;margin-top:2px;text-decoration:underline;font-weight:700}
.tabs{display:flex;gap:8px;background:#fff;border-bottom:1px solid var(--line);margin:0 -16px;padding:22px 16px 12px;position:sticky;top:63px;z-index:19}
.tabs button{flex:1;border:0;border-radius:8px;padding:11px 6px;font-size:13px;font-weight:700;background:#f0eeeb;color:#6b6862;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.tabs button.active{background:var(--accent);color:#fff;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:18px;font-weight:900}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 8px}
label{font-weight:800;display:block;margin:14px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#6b6862}
select,input{width:100%;padding:14px;border:1px solid #d9d5cf;border-radius:8px;background:#fff;font-size:16px;color:var(--ink);font-family:inherit}
select{letter-spacing:.4px;font-weight:700}
button.primary{width:100%;border:0;border-radius:8px;padding:16px;font-size:17px;font-weight:900;background:var(--accent);color:#fff;margin-top:16px;cursor:pointer;letter-spacing:.5px}
button.primary:active{background:var(--accent2)}
button:disabled{opacity:.5}
.subtabs{display:flex;gap:8px;margin-bottom:8px}
.subtabs button{flex:1;min-width:0;border:0;border-radius:8px;padding:11px 4px;font-size:12px;font-weight:800;background:#f0eeeb;color:#6b6862;cursor:pointer;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.subtabs button.active{background:var(--brand);color:#fff}
.row{padding:14px 2px;border-bottom:2px solid #f0eeeb}
.row:last-child{border-bottom:0}
.row .t{font-weight:800;letter-spacing:.3px}
.row .m{color:var(--muted);font-size:13px;margin-top:2px}
.row .d{color:#a29d95;font-size:12px;margin-top:2px}
.badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:middle;text-transform:uppercase}
.b-ok{background:#e6f2ea;color:var(--green)}
.b-use{background:#fdeede;color:var(--amber)}
.b-rep{background:#fdeded;color:var(--red)}
.b-in{background:#177245;color:#fff}
.b-out{background:#c0392b;color:#fff}
.b-veh{background:#eef1f5;color:#1f2328}
.b-zona{background:#faf1e8;color:var(--accent)}
.rowbtn{width:auto;padding:9px 16px;font-size:12px;font-weight:800;border:0;border-radius:6px;background:#f0eeeb;color:#25303c;cursor:pointer;margin-top:9px;text-transform:uppercase;letter-spacing:.4px}
.rowbtn.blue{background:var(--accent);color:#fff}
.rowbtn.grn{background:var(--green);color:#fff}
.flex{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow button{flex:1;border:0;border-radius:8px;padding:18px;font-size:17px;font-weight:900;color:#fff;cursor:pointer;letter-spacing:.5px}
.b-entrada{background:var(--green)}
.b-salida{background:var(--red)}
.gps{background:#faf6f2;border:1px solid #f0e3d7;border-radius:8px;padding:11px;margin-top:12px;font-size:13px;color:#5a544d;font-weight:600}
.ok{display:none;background:#e6f2ea;color:var(--green);padding:12px;border-radius:8px;margin-top:14px;font-weight:800;font-size:14px}
.error{display:none;background:#fdeded;color:var(--red);padding:12px;border-radius:8px;margin-top:14px;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.count{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 4px}
.center{max-width:380px;margin:14vh auto 0;text-align:center}
.center .wm{font-size:32px;font-weight:900;letter-spacing:2px;color:var(--ink)}
.center .wms{font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin:4px 0 22px;font-weight:700}
.center h1{font-size:22px;margin:0 0 6px;font-weight:900}
.center p{color:var(--muted);font-size:14px;margin:0 0 18px}
a.maps{color:var(--accent);text-decoration:none;font-size:12px}
#hobrawrap{background:#fff4ec;border:1px solid #f6d3b3;border-radius:8px;padding:6px 12px 12px;margin-top:8px}
#hobrawrap label{color:var(--accent)}
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:20px 12px;min-height:92px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);transition:border-color .12s,transform .05s}
.tile:active{transform:scale(.97);border-color:var(--accent)}
.tile .tn{font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;color:var(--ink);line-height:1.15}
.tile .tc{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.tile .tchev{font-size:18px;color:var(--muted);font-weight:900}
.backbar{display:flex;align-items:center;gap:8px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:15px 16px;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;cursor:pointer;margin-bottom:12px;font-family:inherit;box-shadow:0 3px 10px #e2680f33}
.backbar:active{background:var(--accent2)}
.backbar .ar{font-size:20px;line-height:1}
.crumb{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:2px 2px 8px}
@keyframes flashreq{0%,100%{box-shadow:none;border-color:#d9d5cf}20%,60%{box-shadow:0 0 0 4px #c0392b40;border-color:var(--red)}40%,80%{box-shadow:0 0 0 2px #c0392b26;border-color:var(--red)}}
input.flash,select.flash{animation:flashreq .8s ease;border-color:var(--red)!important}
</style>
</head>
<body>
<main>
  <div class="appbar">
    <div class="brand"><b>AZERO</b><span>Control interno</span></div>
    <div class="who" id="who"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://sujletbuufvaajommusm.supabase.co";
const SB_KEY="sb_publishable_KooKb58QlNiOATewpMFv6Q_kcU-ASuY";
const ADMIN_PASS="azero2026";
const ADMIN_PASS_LIMIT="Azero2026limit";
const VAPID_PUBLIC="BK6t9YiFOFHYF3uLwAxOKxupAL3RMpE1WtkDOpx1W09TMzvxbKp93FdaoWnSsfYyB-c3wvDlBNYZihI5Z4J_-HU";
const db=supabase.createClient(SB_URL,SB_KEY);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
function urlB64ToU8(s){const pad="=".repeat((4-s.length%4)%4);const b=(s+pad).replace(/-/g,"+").replace(/_/g,"/");const raw=atob(b);const u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);return u;}

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function up(s){return String(s==null?"":s).toUpperCase();}
function fmt(ts){return ts?new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"";}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

let worker=null, vehiculos=[], condMap={}, vehMap={}, obras=[], zonas=[], adminRol="full";
const params=new URLSearchParams(location.search);
const wmHTML='<div class="wm">AZERO</div><div class="wms">Control interno</div>';

function distM(a,b,c,d){const R=6371000,r=Math.PI/180;const dLa=(c-a)*r,dLo=(d-b)*r;const s=Math.sin(dLa/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function resolverZona(lat,lng){let best=null,bd=1e12;zonas.forEach(z=>{const d=distM(lat,lng,z.lat,z.lng);if(d<=z.radio_m&&d<bd){bd=d;best=z.nombre;}});return best;}
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,precision_m:Math.round(p.coords.accuracy)}),e=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:0});});}

async function boot(){
  let token=params.get("u");
  if(token){lsSet("azero_token",token);}
  else if(!params.has("admin")){token=lsGet("azero_token");}
  if(params.has("admin"))return startAdmin();
  if(token){
    const {data,error}=await db.from("conductores").select("id,nombre").eq("token",token).limit(1);
    if(!error&&data&&data.length){worker=data[0];return startPersonal();}
    lsDel("azero_token");
    return renderCenter("Enlace no válido","Este enlace personal no es correcto. Pide a administración que te envíe el tuyo.",true);
  }
  startAdmin();
}
function renderCenter(title,text,adminLink){
  $("#tabs").innerHTML="";$("#who").innerHTML="";
  $("#app").innerHTML=`<div class="center">${wmHTML}<h1>${esc(title)}</h1><p>${esc(text)}</p>${adminLink?'<button class="linkbtn" style="font-size:14px" onclick="location.search=\'?admin=1\'">Entrar como administrador</button>':''}</div>`;
}
function startAdmin(){
  worker=null;
  if(lsGet("azero_admin")==="1"){adminRol=lsGet("azero_rol")||"full";return renderAdmin();}
  $("#tabs").innerHTML="";$("#who").innerHTML="";
  $("#app").innerHTML=`<div class="center">${wmHTML}<h1>Administrador</h1><p>Introduce la contraseña para ver los registros.</p><input id="pass" type="password" placeholder="Contraseña" autocomplete="off"><button class="primary" onclick="tryAdmin()">Entrar</button><div id="passErr" class="error"></div></div>`;
  const i=$("#pass");i.addEventListener("keydown",e=>{if(e.key==="Enter")tryAdmin();});i.focus();
}
function tryAdmin(){const p=$("#pass").value;if(p===ADMIN_PASS){adminRol="full";lsSet("azero_admin","1");lsSet("azero_rol","full");renderAdmin();}else if(p===ADMIN_PASS_LIMIT){adminRol="herr";lsSet("azero_admin","1");lsSet("azero_rol","herr");renderAdmin();}else{const e=$("#passErr");e.textContent="Contraseña incorrecta.";e.style.display="block";}}
window.tryAdmin=tryAdmin;
function adminLogout(){lsDel("azero_admin");lsDel("azero_rol");location.search="";}
window.adminLogout=adminLogout;

async function loadBase(){
  const [v,c,o,g]=await Promise.all([
    db.from("vehiculos").select("id,nombre,matricula,activo,en_uso,conductor_actual_id").eq("activo",true).order("nombre"),
    db.from("conductores").select("id,nombre").order("nombre"),
    db.from("obras").select("id,codigo,nombre,lat,lng,radio_m").eq("activa",true).order("codigo"),
    db.from("geocercas").select("nombre,lat,lng,radio_m").eq("activa",true)
  ]);
  if(v.error)throw v.error; if(c.error)throw c.error;
  vehiculos=v.data;
  condMap={};c.data.forEach(x=>condMap[x.id]=x.nombre);
  vehMap={};vehiculos.forEach(x=>vehMap[x.id]=x);
  obras=o.error?[]:o.data;
  zonas=[];
  if(!g.error)g.data.forEach(z=>zonas.push({nombre:z.nombre,lat:z.lat,lng:z.lng,radio_m:z.radio_m||150}));
  obras.forEach(o=>{if(o.lat!=null&&o.lng!=null)zonas.push({nombre:o.codigo+" · "+o.nombre,lat:o.lat,lng:o.lng,radio_m:o.radio_m||150});});
}

/* PERSONAL */
function startPersonal(){
  $("#who").innerHTML=`<b>${esc(worker.nombre)}</b><span>Tu acceso personal</span>`;
  $("#tabs").innerHTML=`<button data-t="veh" onclick="pGo('veh')">Vehíc.</button><button data-t="fic" onclick="pGo('fic')">Fichaje</button><button data-t="herr" onclick="pGo('herr')">Herram.</button><button data-t="epi" onclick="pGo('epi')">EPIs</button>`;
  pGo("veh");
}
function pGo(t){[...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active',b.dataset.t===t));if(t==="veh")pVeh();if(t==="fic")pFic();if(t==="herr")pHerr();if(t==="epi")pEpi();}
window.pGo=pGo;

let vSub="coger";
async function pVeh(){
  vSub="coger";
  $("#app").innerHTML=`<div class="card"><div class="subtabs"><button id="sc" class="${vSub==='coger'?'active':''}" onclick="vSet('coger')">Coger</button><button id="su" class="${vSub==='uso'?'active':''}" onclick="vSet('uso')">En uso</button></div><div id="vbody"><p class="empty">Cargando...</p></div><div id="vOk" class="ok"></div><div id="vErr" class="error"></div></div>`;
  try{await loadBase();vSet(vSub);}catch(e){msg("#vErr","No se han podido cargar los datos: "+e.message,true);}
}
function vSet(s){vSub=s;$("#sc").classList.toggle("active",s==="coger");$("#su").classList.toggle("active",s==="uso");s==="coger"?vCoger():vUso();}
window.vSet=vSet;
function vCoger(){
  const libres=vehiculos.filter(x=>!x.en_uso);
  $("#vbody").innerHTML=`<label>Vehículo disponible</label><select id="veh"><option value="">SELECCIONA VEHÍCULO</option>${libres.map(x=>`<option value="${x.id}">${esc(up(x.nombre))} — ${esc(up(x.matricula))}</option>`).join("")}</select><button class="primary" onclick="coger()">COGER VEHÍCULO</button><p class="hint" style="margin-top:10px">Quedará registrado a tu nombre (${esc(worker.nombre)}) con la fecha y hora.</p>`;
}
async function coger(){
  const vid=+$("#veh").value;if(!vid){msg("#vErr","Selecciona un vehículo.",true);return;}
  const yaTengo=vehiculos.find(x=>x.en_uso&&x.conductor_actual_id===worker.id);
  if(yaTengo){return msg("#vErr","Ya tienes un vehículo en uso ("+up(yaTengo.nombre)+"). Devuélvelo antes de coger otro.",true);}
  const b=event.target;b.disabled=true;
  const chk=await db.from("vehiculos").select("en_uso,conductor_actual_id").eq("id",vid).single();
  if(!chk.error&&chk.data&&chk.data.en_uso){b.disabled=false;await loadBase();vSet("coger");return msg("#vErr","Ese vehículo ya lo ha cogido otra persona. Actualiza la lista.",true);}
  const r1=await db.from("registros").insert({conductor_id:worker.id,vehiculo_id:vid});
  if(r1.error){b.disabled=false;return msg("#vErr",r1.error.message,true);}
  const r2=await db.from("vehiculos").update({en_uso:true,conductor_actual_id:worker.id}).eq("id",vid);
  b.disabled=false;if(r2.error)return msg("#vErr",r2.error.message,true);
  msg("#vOk","✅ "+up(vehMap[vid].nombre)+" cogido y registrado.");await loadBase();vSet("coger");
}
window.coger=coger;
async function vUso(){
  const enUso=vehiculos.filter(x=>x.en_uso);
  const reg=await db.from("registros").select("vehiculo_id,created_at").is("fecha_devolucion",null).order("created_at",{ascending:false});
  const desde={};if(!reg.error)reg.data.forEach(r=>{if(!(r.vehiculo_id in desde))desde[r.vehiculo_id]=r.created_at;});
  if(!enUso.length){$("#vbody").innerHTML='<p class="empty">No hay vehículos en uso ahora mismo.</p>';return;}
  $("#vbody").innerHTML=enUso.map(v=>`<div class="row"><div class="flex"><div><div class="t">${esc(up(v.nombre))} <span class="badge b-veh">${esc(up(v.matricula))}</span></div><div class="m">Conductor: ${esc(condMap[v.conductor_actual_id]||"—")}${desde[v.id]?" · desde "+fmt(desde[v.id]):""}</div></div><button class="rowbtn grn" onclick="devolver(${v.id})">Devolver</button></div></div>`).join("");
}
async function devolver(vid){
  const r1=await db.from("registros").update({fecha_devolucion:new Date().toISOString()}).eq("vehiculo_id",vid).is("fecha_devolucion",null);
  if(r1.error)return msg("#vErr",r1.error.message,true);
  const r2=await db.from("vehiculos").update({en_uso:false,conductor_actual_id:null}).eq("id",vid);
  if(r2.error)return msg("#vErr",r2.error.message,true);
  msg("#vOk","✅ "+(vehMap[vid]?up(vehMap[vid].nombre):"Vehículo")+" devuelto.");await loadBase();vSet("uso");
}
window.devolver=devolver;

/* FICHAJE */
function pFic(){
  $("#app").innerHTML=`<div class="card"><h2>Fichaje</h2><p class="hint">${esc(worker.nombre)} — pulsa entrada o salida. Al fichar se usa tu ubicación para detectar Taller u obra.</p><div class="btnrow"><button class="b-entrada" onclick="fichar('entrada')">ENTRADA</button><button class="b-salida" onclick="fichar('salida')">SALIDA</button></div><div id="gps" class="gps" style="display:none"></div><div id="fOk" class="ok"></div><div id="fErr" class="error"></div></div><div class="card"><h2>Avisos de fichaje</h2><p class="hint">Recibe un aviso en este móvil a las 07:00 (fichar entrada) y a las 17:00 (fichar salida), de lunes a viernes. En iPhone, añade antes la app a la pantalla de inicio.</p><button class="rowbtn blue" id="avisoBtn" onclick="activarAvisos()">🔔 Activar avisos en este móvil</button><div id="avisoMsg" class="hint" style="margin-top:8px"></div></div><div class="card"><h2>Vacaciones</h2><div id="vacSummary" class="hint">Cargando…</div><div id="vacForm"></div><button class="rowbtn blue" id="vacBtn" onclick="openVacForm()">Solicitar días</button><div id="vacMine" style="margin-top:6px"></div><div id="vacOk" class="ok"></div><div id="vacErr" class="error"></div></div><div class="card"><h2>Mis últimos fichajes</h2><div id="misFic"><p class="empty">Cargando…</p></div></div>`;
  if(!zonas.length)loadBase().catch(()=>{});
  loadMisFichajes();loadVac();updateAvisoUI();
}
async function activarAvisos(){
  const m=$("#avisoMsg");
  try{
    if(!("serviceWorker" in navigator)||!("PushManager" in window)){if(m)m.textContent="Este móvil o navegador no admite avisos. En iPhone, añade la app a la pantalla de inicio y vuelve a intentarlo.";return;}
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){if(m)m.textContent="No se han permitido las notificaciones. Actívalas en los ajustes del navegador y reintenta.";return;}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToU8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const r=await db.from("push_subs").upsert({trabajador_id:worker.id,endpoint:sub.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"});
    if(r.error){if(m)m.textContent="No se ha podido guardar la suscripción: "+r.error.message;return;}
    if(m)m.innerHTML='<b style="color:var(--green)">✅ Avisos activados en este móvil.</b>';
    const b=$("#avisoBtn");if(b)b.textContent="🔔 Avisos activados";
  }catch(e){if(m)m.textContent="No se han podido activar los avisos: "+e.message;}
}
window.activarAvisos=activarAvisos;
async function updateAvisoUI(){
  try{
    if(!("serviceWorker" in navigator))return;
    const reg=await navigator.serviceWorker.getRegistration();if(!reg||!reg.pushManager)return;
    const sub=await reg.pushManager.getSubscription();

/* VACACIONES */
const DIAS_VAC_ANIO=30;
let vacMine=[];
function fmtD(d){if(!d)return "";const x=new Date(String(d).slice(0,10)+"T00:00:00");return x.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"});}
function diasNaturales(ini,fin){const a=new Date(ini+"T00:00:00"),b=new Date(fin+"T00:00:00");return Math.round((b-a)/86400000)+1;}
function vacBadge(e){return e==="pendiente"?'<span class="badge b-use">Pendiente</span>':e==="aprobada"?'<span class="badge b-ok">Aprobada</span>':'<span class="badge b-rep">Rechazada</span>';}
function vacAprobadas(list,tid){const y=new Date().getFullYear();return list.filter(v=>v.trabajador_id===tid&&v.estado==="aprobada"&&new Date(String(v.fecha_inicio).slice(0,10)+"T00:00:00").getFullYear()===y).reduce((s,v)=>s+(v.dias||0),0);}
async function loadVac(){const {data,error}=await db.from("vacaciones").select("*").eq("trabajador_id",worker.id).order("fecha_inicio",{ascending:false});vacMine=error?[]:data;renderVac();}
function renderVac(){
  const y=new Date().getFullYear();
  const aprob=vacAprobadas(vacMine,worker.id);
  const pend=vacMine.filter(v=>v.estado==="pendiente").reduce((s,v)=>s+(v.dias||0),0);
  const disp=DIAS_VAC_ANIO-aprob;
  const s=$("#vacSummary");if(s)s.innerHTML=`Te quedan <b style="color:var(--green)">${disp}</b> de ${DIAS_VAC_ANIO} días naturales (${y}).${pend?` <b style="color:var(--amber)">${pend} pendiente${pend>1?"s":""} de aprobar.</b>`:""}`;
  const m=$("#vacMine");if(m)m.innerHTML=vacMine.length?vacMine.map(v=>`<div class="row"><div class="t">${fmtD(v.fecha_inicio)} → ${fmtD(v.fecha_fin)} ${vacBadge(v.estado)}</div><div class="m">${v.dias} día${v.dias>1?"s":""} naturales${v.nota?" · "+esc(v.nota):""}</div></div>`).join(""):'<p class="empty">Aún no has solicitado vacaciones.</p>';
}
function openVacForm(){const f=$("#vacForm"),b=$("#vacBtn");if(b)b.style.display="none";if(f)f.innerHTML=`<label>Desde</label><input type="date" id="vIni"><label>Hasta</label><input type="date" id="vFin"><input id="vNota" placeholder="Motivo (opcional)" style="margin-top:10px"><div style="display:flex;gap:8px;margin-top:10px"><button class="rowbtn" style="flex:1" onclick="closeVacForm()">Cancelar</button><button class="rowbtn blue" style="flex:1" onclick="pedirVac()">Enviar solicitud</button></div>`;}
window.openVacForm=openVacForm;
function closeVacForm(){const f=$("#vacForm");if(f)f.innerHTML="";const b=$("#vacBtn");if(b)b.style.display="";}
window.closeVacForm=closeVacForm;
async function pedirVac(){
  const ini=$("#vIni")?.value, fin=$("#vFin")?.value;
  if(!ini||!fin)return msg("#vacErr","Elige las fechas de inicio y fin.",true);
  if(fin<ini)return msg("#vacErr","La fecha de fin no puede ser anterior al inicio.",true);
  const dias=diasNaturales(ini,fin);
  const disp=DIAS_VAC_ANIO-vacAprobadas(vacMine,worker.id);
  if(dias>disp)return msg("#vacErr","No te quedan tantos días: pides "+dias+" y te quedan "+disp+".",true);
  const nota=($("#vNota")?.value||"").trim();
  const r=await db.from("vacaciones").insert({trabajador_id:worker.id,fecha_inicio:ini,fecha_fin:fin,dias,estado:"pendiente",nota:nota||null});
  if(r.error)return msg("#vacErr",r.error.message,true);
  closeVacForm();msg("#vacOk","✅ Solicitud enviada ("+dias+" días). Pendiente de aprobación.");await loadVac();
}
window.pedirVac=pedirVac;

/* HERRAMIENTAS (personal) */
let herrList=[], hSub="almacen", repairId=null, hDetail=null, hFam=null;
function obraOpts(){return obras.map(o=>{const t=esc(o.codigo+" · "+o.nombre);return `<option value="${t}">${t}</option>`;}).join("");}
function familiaDe(h){if(h.categoria&&String(h.categoria).trim())return String(h.categoria).trim();const n=up(h.nombre||"");if(n.startsWith("TALADRO"))return "Taladros";if(n.startsWith("RADIAL"))return "Radiales";if(n.startsWith("ALARGO"))return "Alargos";if(n.startsWith("GRUPO SOLDAR"))return "Grupos de soldar";if(n.includes("SOPLETE"))return "Soplete";if(n.startsWith("MÁQUINA APRETAR")||n.startsWith("MAQUINA APRETAR"))return "Máquinas de apretar";if(n.startsWith("PISTOLA"))return "Pistolas de químico";if(n.startsWith("BATERÍA")||n.startsWith("BATERIA"))return "Baterías";if(n.startsWith("CARGADOR"))return "Cargadores";if(n.startsWith("CAJÓN")||n.startsWith("CAJON"))return "Cajones";return "Otros";}
async function pHerr(){

  await refreshHerr();hSet("almacen");

function hSet(s){hSub=s;repairId=null;hDetail=null;hFam=null;const map={almacen:"ha",obra:"ho",reparacion:"hr"};["ha","ho","hr"].forEach(id=>{const b=$("#"+id);if(b)b.classList.toggle("active",id===map[s]);});renderHerr();}

function setRepair(id){repairId=id;renderHerr();}
window.setRepair=setRepair;
function openFam(enc){hFam=decodeURIComponent(enc);hDetail=null;repairId=null;renderHerr();}

function openTipo(enc){hDetail=decodeURIComponent(enc);repairId=null;renderHerr();}

function backToFam(){hFam=null;hDetail=null;repairId=null;renderHerr();}

function backBar(label,fn){return `<button class="backbar" onclick="${fn}"><span class="ar">‹</span> ${esc(up(label))}</button>`;}
function unitRow(h){let a="";if(repairId===h.id){a=repairForm(h.id);}else if(h.estado==="disponible"){a=`<div style="display:flex;gap:8px"><button class="rowbtn blue" style="flex:1" onclick="cogerHerr(${h.id})">Coger</button><button class="rowbtn" style="flex:1" onclick="setRepair(${h.id})">Avería</button></div>`;}else if(h.estado==="en_uso"){const mine=h.responsable_id===worker.id?" (tú)":"";a=`<div class="d">Con: ${esc(condMap[h.responsable_id]||"—")}${mine}${h.obra_actual?" · "+esc(h.obra_actual):""}</div><div style="display:flex;gap:8px"><button class="rowbtn grn" style="flex:1" onclick="devolverHerr(${h.id})">Devolver</button><button class="rowbtn" style="flex:1" onclick="setRepair(${h.id})">Avería</button></div>`;}else if(h.estado==="reparacion"){a=`<div class="d">🔧 En reparación${h.nota_reparacion?" — "+esc(h.nota_reparacion):""}</div>`;}else{a='<div class="d">Dada de baja</div>';}return `<div class="row"><div class="t">${esc(up(h.codigo||h.nombre))} ${estBadge(h.estado)}</div><div class="m">${esc(h.nombre)}${h.marca?" · "+esc(h.marca):""}</div>${a}</div>`;}
async function refreshHerr(){const {data,error}=await db.from("herramientas").select("*").order("nombre");if(error){$("#hbody").innerHTML='<p class="empty">'+esc(error.message)+'</p>';return;}herrList=data;renderHerr();}
function estBadge(e){return e==="disponible"?'<span class="badge b-ok">Disponible</span>':e==="en_uso"?'<span class="badge b-use">En uso</span>':e==="reparacion"?'<span class="badge b-rep">Reparación</span>':'<span class="badge b-rep">Baja</span>';}
function hMeta(h){return `<div class="m">${esc(h.codigo||"")}${h.marca?" · "+esc(h.marca):""}${h.categoria?" · "+esc(h.categoria):""}</div>`;}
function repairForm(id){return `<div style="margin-top:9px"><input id="rep${id}" placeholder="Motivo del fallo (obligatorio, ej. no arranca)" style="font-size:14px;padding:11px"><div style="display:flex;gap:8px;margin-top:8px"><button class="rowbtn" style="flex:1" onclick="setRepair(null)">Cancelar</button><button class="rowbtn" style="flex:1;background:var(--red);color:#fff" onclick="reportAveria(${id})">Enviar a reparación</button></div></div>`;}
function renderHerr(){
  const q=($("#hfil")?.value||"").toLowerCase();
  const obw=$("#hobrawrap");if(obw)obw.style.display=(hSub==="almacen"&&(q||(hFam&&hDetail)))?"block":"none";
  const match=h=>!q||((h.nombre+" "+(h.codigo||"")+" "+(h.marca||"")+" "+(h.categoria||"")).toLowerCase().includes(q));
  const body=$("#hbody");if(!body)return;
  if(hSub==="almacen"){
    const disp=herrList.filter(h=>h.estado==="disponible").filter(match);
    if(q){
      if(!disp.length){body.innerHTML='<p class="empty">Sin resultados para esa búsqueda.</p>';return;}
      body.innerHTML=`<p class="count">${disp.length} resultado${disp.length!==1?"s":""}</p>`+disp.sort((a,b)=>(a.codigo||"").localeCompare(b.codigo||"")).map(unitRow).join("");
    }else if(!hFam){
      const fam={};disp.forEach(h=>{const f=familiaDe(h);fam[f]=(fam[f]||0)+1;});
      const fams=Object.keys(fam).sort();
      if(!fams.length){body.innerHTML='<p class="empty">No hay herramientas disponibles en el almacén.</p>';return;}
      body.innerHTML=`<p class="count">${fams.length} familias · ${disp.length} disponibles</p><div class="tilegrid">`+fams.map(f=>`<button class="tile" onclick="openFam('${encodeURIComponent(f)}')"><div class="tn">${esc(up(f))}</div><div class="tc">${fam[f]} disp.</div></button>`).join("")+`</div>`;
    }else if(!hDetail){
      const inFam=disp.filter(h=>familiaDe(h)===hFam);
      const tot={},av={};herrList.filter(h=>familiaDe(h)===hFam).forEach(h=>{tot[h.nombre]=(tot[h.nombre]||0)+1;});inFam.forEach(h=>{av[h.nombre]=(av[h.nombre]||0)+1;});
      const tipos=Object.keys(av).sort();
      if(!tipos.length){body.innerHTML=backBar("Volver a familias","backToFam()")+'<p class="empty">No hay unidades disponibles en esta familia.</p>';return;}
      body.innerHTML=backBar("Volver a familias","backToFam()")+`<div class="crumb">${esc(up(hFam))} · ${inFam.length} disponibles</div><div class="tilegrid">`+tipos.map(n=>`<button class="tile" onclick="openTipo('${encodeURIComponent(n)}')"><div class="tn">${esc(up(n))}</div><div class="tc">${av[n]} disp.${tot[n]>av[n]?" / "+tot[n]:""}</div></button>`).join("")+`</div>`;
    }else{
      const units=herrList.filter(h=>h.nombre===hDetail).sort((a,b)=>(a.codigo||"").localeCompare(b.codigo||""));
      const dispN=units.filter(h=>h.estado==="disponible").length;
      body.innerHTML=backBar("Volver a "+hFam,"backToTipos()")+`<div class="crumb">${esc(up(hDetail))} · ${dispN} disponible${dispN!==1?"s":""} de ${units.length}</div>`+units.map(unitRow).join("");
    }
  }else if(hSub==="obra"){
    const list=herrList.filter(h=>h.estado==="en_uso").filter(match);
    if(!list.length){body.innerHTML='<p class="empty">No hay herramientas en obra ahora mismo.</p>';return;}
    const g={};list.forEach(h=>{const k=h.obra_actual||"Sin obra / Taller";(g[k]=g[k]||[]).push(h);});
    body.innerHTML=Object.keys(g).sort().map(o=>`<p class="count">${esc(o)}</p>`+g[o].map(h=>{const mine=h.responsable_id===worker.id?" (tú)":"";return `<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div>${hMeta(h)}<div class="d">Con: ${esc(condMap[h.responsable_id]||"—")}${mine}</div>${repairId===h.id?repairForm(h.id):`<div style="display:flex;gap:8px"><button class="rowbtn grn" style="flex:1" onclick="devolverHerr(${h.id})">Devolver</button><button class="rowbtn" style="flex:1" onclick="setRepair(${h.id})">Avería</button></div>`}</div>`;}).join("")).join("");
  }else{
    const list=herrList.filter(h=>h.estado==="reparacion").filter(match);
    body.innerHTML=list.length?(`<p class="count">${list.length} en reparación</p>`+list.map(h=>`<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div>${hMeta(h)}${h.nota_reparacion?`<div class="d">⚠️ ${esc(h.nota_reparacion)}</div>`:""}<div class="d">Reportada por: ${esc(condMap[h.responsable_id]||"—")}</div></div>`).join("")):'<p class="empty">No hay herramientas en reparación.</p>';
  }
}

function grupoEpi(x){return x.grupo&&String(x.grupo).trim()?String(x.grupo).trim():(x.categoria==="ropa"?"Ropa":"EPIs");}
function stockMap(x){try{const s=x&&x.stock_tallas;if(!s)return {};return typeof s==="string"?(JSON.parse(s)||{}):s;}catch(e){return {};}}
function totalStock(x){const m=stockMap(x);const ks=Object.keys(m);if(ks.length)return ks.reduce((a,k)=>a+(parseInt(m[k],10)||0),0);return x.stock||0;}
function tallasEpi(x){const t=(x.tallas||"").split(",").map(s=>s.trim()).filter(Boolean);if(t.length)return t;return Object.keys(stockMap(x));}

function renderEpi(){
  const body=$("#ebody");if(!body)return;
  if(eSub==="solicitar"){
    const activos=epiCat.filter(x=>x.activo!==false);
    if(!eGrupo){
      const esp=espOpen?espForm():`<button class="rowbtn" style="width:100%;background:#faf1e8;color:var(--accent);margin-bottom:12px" onclick="openEsp()">✚ Solicitar algo especial (fuera de lista)</button>`;
      if(!activos.length){body.innerHTML=esp+'<p class="empty">No hay EPIs ni ropa en el catálogo todavía.</p>';return;}
      const g={};activos.forEach(x=>{const k=grupoEpi(x);g[k]=(g[k]||0)+1;});
      const grupos=Object.keys(g).sort(gruposOrden);
      body.innerHTML=esp+`<p class="count">${grupos.length} grupos</p><div class="tilegrid">`+grupos.map(k=>`<button class="tile" onclick="openEGrupo('${encodeURIComponent(k)}')"><div class="tn">${esc(up(k))}</div><div class="tc">${g[k]} artículo${g[k]>1?"s":""}</div></button>`).join("")+`</div>`;
    }else{
      const items=activos.filter(x=>grupoEpi(x)===eGrupo).sort((a,b)=>a.nombre.localeCompare(b.nombre));
      body.innerHTML=backBar("Volver a grupos","backEGrupo()")+`<div class="crumb">${esc(up(eGrupo))}</div>`+items.map(it=>{const tl=tallasEpi(it);const tot=totalStock(it);return `<div class="row"><div class="t">${esc(up(it.nombre))}</div><div class="m">${tl.length?("Tallas: "+esc(tl.join(", "))+" · "+tot+" en stock"):(it.stock>0?"Stock: "+it.stock:"Sin stock (se pedirá)")}</div>${epiReqId===it.id?reqForm(it):`<button class="rowbtn blue" onclick="openReq(${it.id})">Solicitar</button>`}</div>`;}).join("");
    }
  }else{
    if(!epiMias.length){body.innerHTML='<p class="empty">Aún no has solicitado ningún EPI.</p>';return;}
    const nm={};epiCat.forEach(x=>nm[x.id]=x);
    body.innerHTML=epiMias.map(s=>{
      const especial=!s.epi_id;const it=nm[s.epi_id];const nombre=especial?(s.nota||"Solicitud especial"):(it?it.nombre:("EPI #"+s.epi_id));
      let extra="";
      if(s.estado==="entregado")extra=`<button class="rowbtn grn" onclick="openSign(${s.id})">✍ Firmar recepción</button>`+(signId===s.id?signPad(s.id):"");
      else if(s.estado==="firmado")extra=`<div class="d">✔ Recibido y firmado el ${fmt(s.fecha_firma)}</div>`;
      else if(s.estado==="solicitado")extra=`<div class="d">Pendiente de entrega</div>`;
      else extra=`<div class="d">Solicitud rechazada</div>`;
      return `<div class="row"><div class="t">${esc(up(nombre))} ${especial?'<span class="badge b-zona">Especial</span> ':''}${epiEstado(s.estado)}</div><div class="m">${s.cantidad>1?s.cantidad+" uds":"1 ud"}${s.talla?" · talla "+esc(s.talla):""}</div><div class="d">Solicitado: ${fmt(s.fecha_solicitud||s.created_at)}</div>${extra}</div>`;
    }).join("");
  }
}
function signPad(id){return `<div style="margin-top:9px"><div class="d" style="margin-bottom:4px">Firma aquí con el dedo:</div><canvas id="sig${id}" width="600" height="200" style="width:100%;height:160px;border:2px dashed #d9d5cf;border-radius:8px;background:#fff;touch-action:none;display:block"></canvas><div style="display:flex;gap:8px;margin-top:8px"><button class="rowbtn" style="flex:1" onclick="clearSign(${id})">Borrar</button><button class="rowbtn" style="flex:1" onclick="cancelSign()">Cancelar</button><button class="rowbtn grn" style="flex:1" onclick="saveSign(${id})">Confirmar firma</button></div></div>`;}
function openSign(id){signId=id;renderEpi();initSig(id);}
window.openSign=openSign;
function initSig(id){const c=document.getElementById("sig"+id);if(!c)return;const ctx=c.getContext("2d");ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#1f2328";let drawing=false;window._sigHas=window._sigHas||{};window._sigHas[id]=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
  const start=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();window._sigHas[id]=true;e.preventDefault();};
  const end=()=>{drawing=false;};
  c.addEventListener("pointerdown",start);c.addEventListener("pointermove",move);c.addEventListener("pointerup",end);c.addEventListener("pointerleave",end);
}
function clearSign(id){const c=document.getElementById("sig"+id);if(c){c.getContext("2d").clearRect(0,0,c.width,c.height);if(window._sigHas)window._sigHas[id]=false;}}
window.clearSign=clearSign;
function cancelSign(){signId=null;renderEpi();}
window.cancelSign=cancelSign;
async function saveSign(id){const c=document.getElementById("sig"+id);if(!c)return;if(!window._sigHas||!window._sigHas[id])return msg("#eErr","Firma con el dedo antes de confirmar.",true);const data=c.toDataURL("image/png");const r=await db.from("epi_solicitudes").update({estado:"firmado",fecha_firma:new Date().toISOString(),firma:data}).eq("id",id);if(r.error)return msg("#eErr",r.error.message,true);signId=null;msg("#eOk","✅ Recepción firmada. Gracias.");await refreshEpi();}
window.saveSign=saveSign;

/* HERRAMIENTAS — inventario agrupado y editable (admin) */
let invFam=null, invTipo=null, invEditId=null, invAddOpen=false, invDelId=null;
function invReset(){invFam=null;invTipo=null;invEditId=null;invAddOpen=false;invDelId=null;}
function openInvFam(enc){invFam=decodeURIComponent(enc);invTipo=null;invEditId=null;invDelId=null;rInv();}
window.openInvFam=openInvFam;
function openInvTipo(enc){invTipo=decodeURIComponent(enc);invEditId=null;invDelId=null;rInv();}
window.openInvTipo=openInvTipo;
function invBackFam(){invFam=null;invTipo=null;invEditId=null;invDelId=null;rInv();}
window.invBackFam=invBackFam;
function invBackTipo(){invTipo=null;invEditId=null;invDelId=null;rInv();}
window.invBackTipo=invBackTipo;
function toggleInvAdd(){invAddOpen=!invAddOpen;rInv();}
window.toggleInvAdd=toggleInvAdd;
function setInvEdit(id){invEditId=id;invDelId=null;rInv();}
window.setInvEdit=setInvEdit;
function setInvDel(id){invDelId=id;rInv();}
window.setInvDel=setInvDel;
function famOptions(sel){const fams=[...new Set((window._inv||[]).map(familiaDe))].sort();return fams.map(f=>`<option value="${esc(f)}"${f===sel?" selected":""}>${esc(f)}</option>`).join("");}
function invFamSelChange(){const s=$("#iaFamSel"),n=$("#iaFamNew");if(n)n.style.display=(s&&s.value==="__new")?"block":"none";}
window.invFamSelChange=invFamSelChange;
function invAddForm(){
  const hayFam=[...new Set((window._inv||[]).map(familiaDe))].length>0;
  return `<div class="row" style="background:#faf6f2;border-radius:8px;padding:12px;margin-bottom:12px"><div class="t">Añadir herramienta</div><div style="margin-top:8px"><input id="iaNom" placeholder="Nombre / tipo (ej. Taladro percutor, Andamio)" style="width:100%;font-size:14px;padding:11px"></div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><select id="iaFamSel" onchange="invFamSelChange()" style="flex:1;min-width:150px;font-size:14px;padding:11px">${famOptions(invFam||"")}<option value="__new">➕ Nueva familia…</option></select><input id="iaFamNew" placeholder="Nueva familia (ej. Andamios)" style="flex:1;min-width:150px;font-size:14px;padding:11px;display:${hayFam?"none":"block"}"></div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="iaCod" placeholder="Código / QR (opcional)" style="flex:1;min-width:120px;font-size:14px;padding:11px"><input id="iaMar" placeholder="Marca (opcional)" style="flex:1;min-width:120px;font-size:14px;padding:11px"></div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="iaSerie" placeholder="Nº de serie (opcional)" style="flex:2;min-width:120px;font-size:14px;padding:11px"><input id="iaCant" type="number" min="1" value="1" title="Nº de unidades" style="width:90px;font-size:14px;padding:11px"></div><p class="hint" style="margin:8px 0 0">Nº de unidades: crea varias de golpe. Con código, se numeran (código-1, código-2…).</p><div style="display:flex;gap:8px;margin-top:8px"><button class="rowbtn" style="flex:1" onclick="toggleInvAdd()">Cancelar</button><button class="rowbtn blue" style="flex:1" onclick="addHerr()">Guardar</button></div></div>`;
}
async function addHerr(){
  const nom=($("#iaNom")?.value||"").trim();if(!nom){flashInput("iaNom");return msg("#hErr","Pon el nombre de la herramienta.",true);}
  let fam=($("#iaFamSel")?.value||"");if(fam==="__new"||!fam)fam=($("#iaFamNew")?.value||"").trim();
  const cod=($("#iaCod")?.value||"").trim(),mar=($("#iaMar")?.value||"").trim(),serie=($("#iaSerie")?.value||"").trim();
  const cant=Math.max(1,parseInt($("#iaCant")?.value||"1",10)||1);
  const rows=[];for(let i=0;i<cant;i++){rows.push({nombre:nom,categoria:fam||null,codigo:(cant>1&&cod)?(cod+"-"+(i+1)):(cod||null),marca:mar||null,num_serie:serie||null,estado:"disponible"});}
  const r=await db.from("herramientas").insert(rows);if(r.error)return msg("#hErr",r.error.message,true);
  invAddOpen=false;if(fam)invFam=fam;msg("#hOk","✅ "+cant+" unidad"+(cant>1?"es":"")+" añadida"+(cant>1?"s":"")+".");await refreshInv();
}
window.addHerr=addHerr;
function invEditForm(h){
  return `<div style="margin-top:9px;border-top:1px dashed var(--line);padding-top:9px"><input id="ieNom${h.id}" value="${esc(h.nombre||"")}" placeholder="Nombre / tipo" style="width:100%;font-size:14px;padding:10px"><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><select id="ieFam${h.id}" style="flex:1;min-width:130px;font-size:14px;padding:10px">${famOptions(familiaDe(h))}</select><select id="ieEst${h.id}" style="flex:1;min-width:130px;font-size:14px;padding:10px">${["disponible","en_uso","reparacion","baja"].map(e=>`<option value="${e}"${h.estado===e?" selected":""}>${e}</option>`).join("")}</select></div><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><input id="ieCod${h.id}" value="${esc(h.codigo||"")}" placeholder="Código" style="flex:1;min-width:110px;font-size:14px;padding:10px"><input id="ieMar${h.id}" value="${esc(h.marca||"")}" placeholder="Marca" style="flex:1;min-width:110px;font-size:14px;padding:10px"></div><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><input id="ieSerie${h.id}" value="${esc(h.num_serie||"")}" placeholder="Nº serie" style="flex:1;min-width:110px;font-size:14px;padding:10px"><input id="ieFoto${h.id}" value="${esc(h.foto_url||"")}" placeholder="URL foto (opcional)" style="flex:2;min-width:110px;font-size:14px;padding:10px"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="rowbtn" style="flex:1" onclick="setInvEdit(null)">Cancelar</button><button class="rowbtn blue" style="flex:1" onclick="saveHerr(${h.id})">Guardar cambios</button></div></div>`;
}
async function saveHerr(id){
  const g=s=>($("#"+s+id)?.value||"").trim();
  const nombre=g("ieNom");if(!nombre){flashInput("ieNom"+id);return msg("#hErr","El nombre no puede quedar vacío.",true);}
  const upd={nombre:nombre,categoria:g("ieFam")||null,estado:g("ieEst")||"disponible",codigo:g("ieCod")||null,marca:g("ieMar")||null,num_serie:g("ieSerie")||null,foto_url:g("ieFoto")||null};
  const r=await db.from("herramientas").update(upd).eq("id",id);if(r.error)return msg("#hErr",r.error.message,true);
  invEditId=null;msg("#hOk","✅ Cambios guardados.");await refreshInv();
}
window.saveHerr=saveHerr;
async function delHerr(id){const r=await db.from("herramientas").delete().eq("id",id);if(r.error)return msg("#hErr",r.error.message,true);invDelId=null;msg("#hOk","Herramienta borrada.");await refreshInv();}
window.delHerr=delHerr;
function invUnitCard(h){
  const meta=`<div class="m">${esc(h.codigo||"sin código")}${h.marca?" · "+esc(h.marca):""}${h.num_serie?" · nº "+esc(h.num_serie):""}</div>`;
  const con=h.estado==="en_uso"?`<div class="d">Con: ${esc(condMap[h.responsable_id]||"—")}${h.obra_actual?" · "+esc(h.obra_actual):""}</div>`:(h.estado==="reparacion"&&h.nota_reparacion?`<div class="d">⚠️ ${esc(h.nota_reparacion)}</div>`:"");
  let foot;
  if(invEditId===h.id)foot=invEditForm(h);
  else if(invDelId===h.id)foot=`<div style="display:flex;gap:8px;margin-top:8px;align-items:center"><span class="d" style="flex:1">¿Borrar para siempre?</span><button class="rowbtn" style="flex:1" onclick="setInvDel(null)">No</button><button class="rowbtn" style="flex:1;background:var(--red);color:#fff" onclick="delHerr(${h.id})">Sí, borrar</button></div>`;
  else foot=`<div style="display:flex;gap:8px;margin-top:8px"><button class="rowbtn" style="flex:1" onclick="setInvEdit(${h.id})">✎ Editar</button><button class="rowbtn" style="flex:1;background:var(--red);color:#fff" onclick="setInvDel(${h.id})">Borrar</button></div>`;
  return `<div class="row"><div class="t">${esc(up(h.codigo||h.nombre))} ${estBadge(h.estado)}</div>${meta}${con}${foot}</div>`;
}
function renderInv(body){
  const all=window._inv||[];
  const addBtn=`<button class="rowbtn blue" style="width:100%;margin-bottom:10px" onclick="toggleInvAdd()">${invAddOpen?"✕ Cerrar":"➕ Añadir herramienta"}</button>`;
  const addForm=invAddOpen?invAddForm():"";
  if(!invFam){
    const fam={};all.forEach(h=>{const f=familiaDe(h);fam[f]=(fam[f]||0)+1;});
    const fams=Object.keys(fam).sort();
    const tiles=fams.length?`<div class="tilegrid">`+fams.map(f=>`<button class="tile" onclick="openInvFam('${encodeURIComponent(f)}')"><div class="tn">${esc(up(f))}</div><div class="tc">${fam[f]} ud${fam[f]>1?"s":""}</div></button>`).join("")+`</div>`:'<p class="empty">No hay herramientas todavía. Añade la primera.</p>';
    body.innerHTML=addBtn+addForm+`<p class="count">${fams.length} familia${fams.length!==1?"s":""} · ${all.length} unidades</p>`+tiles;
  }else if(!invTipo){
    const inFam=all.filter(h=>familiaDe(h)===invFam);
    const tp={};inFam.forEach(h=>{tp[h.nombre]=(tp[h.nombre]||0)+1;});
    const tipos=Object.keys(tp).sort();
    body.innerHTML=addBtn+addForm+backBar("Volver a familias","invBackFam()")+`<div class="crumb">${esc(up(invFam))} · ${inFam.length} unidad${inFam.length!==1?"es":""}</div>`+(tipos.length?`<div class="tilegrid">`+tipos.map(n=>`<button class="tile" onclick="openInvTipo('${encodeURIComponent(n)}')"><div class="tn">${esc(up(n))}</div><div class="tc">${tp[n]} ud${tp[n]>1?"s":""}</div></button>`).join("")+`</div>`:'<p class="empty">Sin unidades en esta familia.</p>');
  }else{
    const units=all.filter(h=>familiaDe(h)===invFam&&h.nombre===invTipo).sort((a,b)=>(a.codigo||"").localeCompare(b.codigo||""));
    body.innerHTML=addBtn+addForm+backBar("Volver a "+invFam,"invBackTipo()")+`<div class="crumb">${esc(up(invTipo))} · ${units.length} unidad${units.length!==1?"es":""}</div>`+(units.length?units.map(invUnitCard).join(""):'<p class="empty">Sin unidades.</p>');
  }
}

/* EPIS Y ROPA (admin) */
let aESub="solicitudes";
async function aEpi(){
  $("#app").innerHTML=`<div class="card"><h2>EPIs y ropa</h2><div class="subtabs"><button id="eas" onclick="aESet('solicitudes')">Solicitudes</button><button id="eastk" onclick="aESet('stock')">Stock</button><button id="eadoc" onclick="aESet('doc')">Entregas</button></div><div id="aebody"><p class="empty">Cargando…</p></div><div id="eOk" class="ok"></div><div id="eErr" class="error"></div></div>`;
  await refreshAEpi();aESet("solicitudes");
}
async function refreshAEpi(){
  const [c,s]=await Promise.all([
    db.from("epis").select("*").order("nombre"),
    db.from("epi_solicitudes").select("*").order("created_at",{ascending:false}).limit(300)
  ]);
  window._epiCat=c.error?[]:c.data; window._epiSol=s.error?[]:s.data;
  window._epiMap={};window._epiCat.forEach(x=>window._epiMap[x.id]=x);
  renderAEpi();
}
function aESet(s){aESub=s;["eas","eastk","eadoc"].forEach(id=>{const b=$("#"+id);if(b)b.classList.toggle("active",id===(s==="solicitudes"?"eas":s==="stock"?"eastk":"eadoc"));});renderAEpi();}
window.aESet=aESet;
function renderAEpi(){
  const body=$("#aebody");if(!body)return;
  const cat=window._epiCat||[], sol=window._epiSol||[], map=window._epiMap||{};
  const solNom=s=>s.epi_id?(map[s.epi_id]?map[s.epi_id].nombre:"EPI #"+s.epi_id):(s.nota||"Solicitud especial");
  if(aESub==="solicitudes"){
    const pend=sol.filter(s=>s.estado==="solicitado"), entr=sol.filter(s=>s.estado==="entregado");
    let html=`<p class="count">Pendientes de entregar (${pend.length})</p>`;
    html+=pend.length?pend.map(s=>{const it=map[s.epi_id];const esp=!s.epi_id;return `<div class="row"><div class="t">${esc(condMap[s.trabajador_id]||"—")} → ${esc(up(solNom(s)))} ${esp?'<span class="badge b-zona">Especial</span>':''}</div><div class="m">${s.cantidad>1?s.cantidad+" uds":"1 ud"}${s.talla?" · talla "+esc(s.talla):""}${it&&!esp?" · stock "+totalStock(it):""}</div><div class="d">Solicitado: ${fmt(s.fecha_solicitud||s.created_at)}</div><div style="display:flex;gap:8px"><button class="rowbtn grn" style="flex:1" onclick="entregarEpi(${s.id})">Marcar entregado</button><button class="rowbtn" style="flex:1;background:var(--red);color:#fff" onclick="rechazarEpi(${s.id})">Rechazar</button></div></div>`;}).join(""):'<p class="empty">No hay solicitudes pendientes.</p>';
    html+=`<p class="count">Entregados · esperando firma (${entr.length})</p>`;
    html+=entr.length?entr.map(s=>{const esp=!s.epi_id;return `<div class="row"><div class="t">${esc(condMap[s.trabajador_id]||"—")} → ${esc(up(solNom(s)))} ${esp?'<span class="badge b-zona">Especial</span> ':''}<span class="badge b-zona">Por firmar</span></div><div class="m">${s.cantidad>1?s.cantidad+" uds":"1 ud"}${s.talla?" · talla "+esc(s.talla):""}</div><div class="d">Entregado: ${fmt(s.fecha_entrega)}</div></div>`;}).join(""):'<p class="empty">Nada pendiente de firma.</p>';
    body.innerHTML=html;
  }else if(aESub==="stock"){
    let html=`<div class="row" style="background:#faf6f2;border-radius:8px;padding:12px"><div class="t">Añadir artículo</div><div style="display:flex;gap:8px;margin-top:8px"><input id="newNom" placeholder="Nombre (ej. Guantes soldar)" style="flex:2;font-size:14px;padding:11px"><input id="newStk" type="number" min="0" value="0" placeholder="Stock" style="width:80px;font-size:14px;padding:11px"></div><div style="display:flex;gap:8px;margin-top:8px"><select id="newGru" style="flex:1;font-size:14px;padding:11px"><option value="Guantes">Guantes</option><option value="Ropa">Ropa</option><option value="EPIs" selected>EPIs</option><option value="Herramienta">Herramienta</option></select><input id="newTal" placeholder="Tallas por coma (ej. M,L,XL)" style="flex:2;font-size:14px;padding:11px"></div><button class="rowbtn blue" style="margin-top:8px" onclick="addEpi()">Añadir artículo</button><p class="hint" style="margin:8px 0 0">Si pones tallas, podrás fijar el stock de cada talla por separado.</p></div>`;
    const grupos=[...new Set(cat.map(grupoEpi))].sort(gruposOrden);
    grupos.forEach(k=>{
      const list=cat.filter(x=>grupoEpi(x)===k);
      html+=`<p class="count">${esc(k)}</p>`+list.map(it=>{
        const tl=tallasEpi(it);const sm=stockMap(it);let ctrl;
        if(tl.length){
          ctrl=`<div class="m">total en stock: <b>${totalStock(it)}</b></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">`+tl.map((t,i)=>`<div style="display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:4px 7px"><span style="font-size:12px;font-weight:800">${esc(t)}</span><input id="st_${it.id}_${i}" type="number" min="0" value="${sm[t]!=null?sm[t]:0}" style="width:54px;font-size:13px;padding:6px"></div>`).join("")+`</div><button class="rowbtn blue" style="margin-top:8px" onclick="setStockTallas(${it.id})">Guardar stock por talla</button><div style="display:flex;gap:8px;margin-top:6px"><input id="settal${it.id}" placeholder="Tallas por coma" value="${esc(it.tallas||tl.join(','))}" style="flex:1;font-size:13px;padding:9px"><button class="rowbtn" onclick="setTallas(${it.id})">Guardar tallas</button></div>`;
        }else{
          ctrl=`<div class="m">stock actual: <b>${it.stock}</b></div><div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button class="rowbtn" onclick="stockEpi(${it.id},-1)">−1</button><button class="rowbtn" onclick="stockEpi(${it.id},1)">+1</button><input id="setstk${it.id}" type="number" min="0" placeholder="fijar" style="width:72px;font-size:14px;padding:9px"><button class="rowbtn" onclick="setStock(${it.id})">Fijar</button></div><div style="display:flex;gap:8px;margin-top:6px"><input id="settal${it.id}" placeholder="Tallas por coma (crea tallas)" style="flex:1;font-size:13px;padding:9px"><button class="rowbtn" onclick="setTallas(${it.id})">Guardar tallas</button></div>`;
        }
        return `<div class="row"><div class="t">${esc(up(it.nombre))}${it.activo===false?' <span class="badge b-rep">Inactivo</span>':""}</div>${ctrl}</div>`;
      }).join("");
    });
    body.innerHTML=html;
  }else{
    const firm=sol.filter(s=>s.estado==="firmado");
    body.innerHTML=`<p class="hint" style="margin-bottom:8px">Comprobante de recepción de EPI firmado por cada trabajador (documentación para la empresa).</p><p class="count">Firmadas (${firm.length})</p>`+(firm.length?firm.map(s=>{const esp=!s.epi_id;return `<div class="row"><div class="t">${esc(condMap[s.trabajador_id]||"—")} — ${esc(up(solNom(s)))} ${esp?'<span class="badge b-zona">Especial</span> ':''}<span class="badge b-ok">Firmado</span></div><div class="m">${s.cantidad>1?s.cantidad+" uds":"1 ud"}${s.talla?" · talla "+esc(s.talla):""}</div><div class="d">Entregado: ${fmt(s.fecha_entrega)} · Firmado: ${fmt(s.fecha_firma)}</div>${s.firma?`<img src="${s.firma}" alt="firma" style="margin-top:6px;max-width:240px;width:100%;border:1px solid var(--line);border-radius:6px;background:#fff">`:""}</div>`;}).join(""):'<p class="empty">Aún no hay entregas firmadas.</p>');
  }
}
async function entregarEpi(id){
  const s=(window._epiSol||[]).find(x=>x.id===id);if(!s)return;
  const it=(window._epiMap||{})[s.epi_id];
  if(it){
    const m=stockMap(it);const cant=s.cantidad||1;
    if(s.talla&&m[s.talla]!=null){m[s.talla]=Math.max(0,(parseInt(m[s.talla],10)||0)-cant);const total=Object.keys(m).reduce((a,k)=>a+(parseInt(m[k],10)||0),0);await db.from("epis").update({stock_tallas:m,stock:total}).eq("id",it.id);}
    else{const nuevo=Math.max(0,(it.stock||0)-cant);await db.from("epis").update({stock:nuevo}).eq("id",it.id);}
  }
  const r=await db.from("epi_solicitudes").update({estado:"entregado",fecha_entrega:new Date().toISOString()}).eq("id",id);
  if(r.error)return msg("#eErr",r.error.message,true);
  msg("#eOk","✅ Marcado como entregado. El trabajador debe firmar la recepción.");await refreshAEpi();
}
window.entregarEpi=entregarEpi;
async function rechazarEpi(id){const r=await db.from("epi_solicitudes").update({estado:"rechazado"}).eq("id",id);if(r.error)return msg("#eErr",r.error.message,true);msg("#eOk","Solicitud rechazada.");await refreshAEpi();}
window.rechazarEpi=rechazarEpi;
async function addEpi(){
  const nom=($("#newNom")?.value||"").trim();if(!nom){flashInput("newNom");return;}
  const gru=$("#newGru")?.value||"EPIs";
  const tal=($("#newTal")?.value||"").trim();
  const stk=Math.max(0,parseInt($("#newStk")?.value||"0",10)||0);
  const cat=gru==="Ropa"?"ropa":"epi";
  const r=await db.from("epis").insert({nombre:nom,categoria:cat,grupo:gru,tallas:tal||null,stock:stk,activo:true});
  if(r.error)return msg("#eErr",r.error.message,true);
  msg("#eOk","✅ Artículo añadido.");await refreshAEpi();
}
window.addEpi=addEpi;
async function stockEpi(id,delta){const it=(window._epiMap||{})[id];if(!it)return;const nuevo=Math.max(0,(it.stock||0)+delta);const r=await db.from("epis").update({stock:nuevo}).eq("id",id);if(r.error)return msg("#eErr",r.error.message,true);await refreshAEpi();}
window.stockEpi=stockEpi;
async function setStock(id){const v=parseInt($("#setstk"+id)?.value,10);if(isNaN(v)||v<0)return;const r=await db.from("epis").update({stock:v}).eq("id",id);if(r.error)return msg("#eErr",r.error.message,true);msg("#eOk","Stock actualizado.");await refreshAEpi();}
window.setStock=setStock;
async function setTallas(id){const v=($("#settal"+id)?.value||"").trim();const r=await db.from("epis").update({tallas:v||null}).eq("id",id);if(r.error)return msg("#eErr",r.error.message,true);msg("#eOk","Tallas actualizadas.");await refreshAEpi();}
window.setTallas=setTallas;
async function setStockTallas(id){const it=(window._epiMap||{})[id];if(!it)return;const tl=tallasEpi(it);const m={};tl.forEach((t,i)=>{const el=document.getElementById("st_"+id+"_"+i);const v=el?parseInt(el.value,10):0;m[t]=(isNaN(v)||v<0)?0:v;});const total=Object.keys(m).reduce((a,k)=>a+m[k],0);const r=await db.from("epis").update({stock_tallas:m,stock:total}).eq("id",id);if(r.error)return msg("#eErr",r.error.message,true);msg("#eOk","Stock por talla guardado.");await refreshAEpi();}
window.setStockTallas=setStockTallas;

function flashInput(id){const el=document.getElementById(id);if(!el)return;el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");try{el.focus();}catch(e){}setTimeout(()=>el.classList.remove("flash"),900);}
function msg(sel,text,isErr){const e=$(sel);if(!e)return;e.textContent=text;e.style.display="block";if(!isErr)setTimeout(()=>e.style.display="none",2600);}

boot().catch(e=>renderCenter("Error",e.message,true));
</script>
</body>
</html>
