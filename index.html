<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<title>AZERO — Control interno</title>
<style>
:root{
  --bg:#f4f3f1; --card:#fff; --ink:#1f2328; --muted:#8a8781; --line:#e6e3df;
  --brand:#1f2328; --accent:#e2680f; --accent2:#b9540b; --green:#177245; --red:#c0392b; --amber:#b7791f;
  --radius:10px; --shadow:0 4px 16px #1f232810;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:auto;padding:0 16px 40px}
.appbar{background:#fff;color:var(--ink);border-top:4px solid var(--accent);border-bottom:1px solid var(--line);margin:0 -16px;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.brand b{display:block;font-size:21px;font-weight:900;letter-spacing:1px;line-height:1;color:var(--ink)}
.brand span{display:block;font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-top:3px;font-weight:700}
.who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
.who b{display:block;font-size:14px;font-weight:800}
.who span{color:var(--muted);font-size:11px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:12px;cursor:pointer;padding:0;margin-top:2px;text-decoration:underline;font-weight:700}
.tabs{display:flex;gap:8px;background:#fff;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px 12px;position:sticky;top:63px;z-index:19}
.tabs button{flex:1;border:0;border-radius:8px;padding:11px 6px;font-size:13px;font-weight:700;background:#f0eeeb;color:#6b6862;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.tabs button.active{background:var(--accent);color:#fff;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:18px;font-weight:900}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 8px}
label{font-weight:800;display:block;margin:14px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#6b6862}
select,input{width:100%;padding:14px;border:1px solid #d9d5cf;border-radius:8px;background:#fff;font-size:16px;color:var(--ink);font-family:inherit}
select{letter-spacing:.4px;font-weight:700}
button.primary{width:100%;border:0;border-radius:8px;padding:16px;font-size:17px;font-weight:900;background:var(--accent);color:#fff;margin-top:16px;cursor:pointer;letter-spacing:.5px}
button.primary:active{background:var(--accent2)}
button:disabled{opacity:.5}
.subtabs{display:flex;gap:8px;margin-bottom:8px}
.subtabs button{flex:1;border:0;border-radius:8px;padding:11px;font-size:13px;font-weight:800;background:#f0eeeb;color:#6b6862;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.subtabs button.active{background:var(--brand);color:#fff}
.row{padding:14px 2px;border-bottom:2px solid #f0eeeb}
.row:last-child{border-bottom:0}
.row .t{font-weight:800;letter-spacing:.3px}
.row .m{color:var(--muted);font-size:13px;margin-top:2px}
.row .d{color:#a29d95;font-size:12px;margin-top:2px}
.badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:middle;text-transform:uppercase}
.b-ok{background:#e6f2ea;color:var(--green)}
.b-use{background:#fdeede;color:var(--amber)}
.b-rep{background:#fdeded;color:var(--red)}
.b-in{background:#177245;color:#fff}
.b-out{background:#c0392b;color:#fff}
.b-veh{background:#eef1f5;color:#1f2328}
.b-zona{background:#faf1e8;color:var(--accent)}
.rowbtn{width:auto;padding:9px 16px;font-size:12px;font-weight:800;border:0;border-radius:6px;background:#f0eeeb;color:#25303c;cursor:pointer;margin-top:9px;text-transform:uppercase;letter-spacing:.4px}
.rowbtn.blue{background:var(--accent);color:#fff}
.rowbtn.grn{background:var(--green);color:#fff}
.flex{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow button{flex:1;border:0;border-radius:8px;padding:18px;font-size:17px;font-weight:900;color:#fff;cursor:pointer;letter-spacing:.5px}
.b-entrada{background:var(--green)}
.b-salida{background:var(--red)}
.gps{background:#faf6f2;border:1px solid #f0e3d7;border-radius:8px;padding:11px;margin-top:12px;font-size:13px;color:#5a544d;font-weight:600}
.ok{display:none;background:#e6f2ea;color:var(--green);padding:12px;border-radius:8px;margin-top:14px;font-weight:800;font-size:14px}
.error{display:none;background:#fdeded;color:var(--red);padding:12px;border-radius:8px;margin-top:14px;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.count{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 4px}
.center{max-width:380px;margin:14vh auto 0;text-align:center}
.center .wm{font-size:32px;font-weight:900;letter-spacing:2px;color:var(--ink)}
.center .wms{font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin:4px 0 22px;font-weight:700}
.center h1{font-size:22px;margin:0 0 6px;font-weight:900}
.center p{color:var(--muted);font-size:14px;margin:0 0 18px}
a.maps{color:var(--accent);text-decoration:none;font-size:12px}
</style>
</head>
<body>
<main>
  <div class="appbar">
    <div class="brand"><b>AZERO</b><span>Control interno</span></div>
    <div class="who" id="who"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://sujletbuufvaajommusm.supabase.co";
const SB_KEY="sb_publishable_KooKb58QlNiOATewpMFv6Q_kcU-ASuY";
const ADMIN_PASS="azero2026";
const db=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function up(s){return String(s==null?"":s).toUpperCase();}
function fmt(ts){return ts?new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"";}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

let worker=null, vehiculos=[], condMap={}, vehMap={}, obras=[], zonas=[];
const params=new URLSearchParams(location.search);
const wmHTML='<div class="wm">AZERO</div><div class="wms">Control interno</div>';

function distM(a,b,c,d){const R=6371000,r=Math.PI/180;const dLa=(c-a)*r,dLo=(d-b)*r;const s=Math.sin(dLa/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function resolverZona(lat,lng){let best=null,bd=1e12;zonas.forEach(z=>{const d=distM(lat,lng,z.lat,z.lng);if(d<=z.radio_m&&d<bd){bd=d;best=z.nombre;}});return best;}
function getPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,precision_m:Math.round(p.coords.accuracy)}),e=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:0});});}

async function boot(){
  let token=params.get("u");
  if(token){lsSet("azero_token",token);}
  else if(!params.has("admin")){token=lsGet("azero_token");}
  if(params.has("admin"))return startAdmin();
  if(token){
    const {data,error}=await db.from("conductores").select("id,nombre").eq("token",token).limit(1);
    if(!error&&data&&data.length){worker=data[0];return startPersonal();}
    lsDel("azero_token");
    return renderCenter("Enlace no válido","Este enlace personal no es correcto. Pide a administración que te envíe el tuyo.",true);
  }
  startAdmin();
}
function renderCenter(title,text,adminLink){
  $("#tabs").innerHTML="";$("#who").innerHTML="";
  $("#app").innerHTML=`<div class="center">${wmHTML}<h1>${esc(title)}</h1><p>${esc(text)}</p>${adminLink?'<button class="linkbtn" style="font-size:14px" onclick="location.search=\'?admin=1\'">Entrar como administrador</button>':''}</div>`;
}
function startAdmin(){
  worker=null;
  if(lsGet("azero_admin")==="1")return renderAdmin();
  $("#tabs").innerHTML="";$("#who").innerHTML="";
  $("#app").innerHTML=`<div class="center">${wmHTML}<h1>Administrador</h1><p>Introduce la contraseña para ver los registros.</p><input id="pass" type="password" placeholder="Contraseña" autocomplete="off"><button class="primary" onclick="tryAdmin()">Entrar</button><div id="passErr" class="error"></div></div>`;
  const i=$("#pass");i.addEventListener("keydown",e=>{if(e.key==="Enter")tryAdmin();});i.focus();
}
function tryAdmin(){if($("#pass").value===ADMIN_PASS){lsSet("azero_admin","1");renderAdmin();}else{const e=$("#passErr");e.textContent="Contraseña incorrecta.";e.style.display="block";}}
window.tryAdmin=tryAdmin;
function adminLogout(){lsDel("azero_admin");location.search="";}
window.adminLogout=adminLogout;

async function loadBase(){
  const [v,c,o,g]=await Promise.all([
    db.from("vehiculos").select("id,nombre,matricula,activo,en_uso,conductor_actual_id").eq("activo",true).order("nombre"),
    db.from("conductores").select("id,nombre").order("nombre"),
    db.from("obras").select("id,codigo,nombre,lat,lng,radio_m").eq("activa",true).order("codigo"),
    db.from("geocercas").select("nombre,lat,lng,radio_m").eq("activa",true)
  ]);
  if(v.error)throw v.error; if(c.error)throw c.error;
  vehiculos=v.data;
  condMap={};c.data.forEach(x=>condMap[x.id]=x.nombre);
  vehMap={};vehiculos.forEach(x=>vehMap[x.id]=x);
  obras=o.error?[]:o.data;
  zonas=[];
  if(!g.error)g.data.forEach(z=>zonas.push({nombre:z.nombre,lat:z.lat,lng:z.lng,radio_m:z.radio_m||150}));
  obras.forEach(o=>{if(o.lat!=null&&o.lng!=null)zonas.push({nombre:o.codigo+" · "+o.nombre,lat:o.lat,lng:o.lng,radio_m:o.radio_m||150});});
}

/* PERSONAL */
function startPersonal(){
  $("#who").innerHTML=`<b>${esc(worker.nombre)}</b><span>Tu acceso personal</span>`;
  $("#tabs").innerHTML=`<button data-t="veh" onclick="pGo('veh')">Vehículos</button><button data-t="fic" onclick="pGo('fic')">Fichaje</button><button data-t="herr" onclick="pGo('herr')">Herram.</button>`;
  pGo("veh");
}
function pGo(t){[...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active',b.dataset.t===t));if(t==="veh")pVeh();if(t==="fic")pFic();if(t==="herr")pHerr();}
window.pGo=pGo;

let vSub="coger";
async function pVeh(){
  $("#app").innerHTML=`<div class="card"><div class="subtabs"><button id="sc" class="${vSub==='coger'?'active':''}" onclick="vSet('coger')">Coger</button><button id="su" class="${vSub==='uso'?'active':''}" onclick="vSet('uso')">En uso</button></div><div id="vbody"><p class="empty">Cargando...</p></div><div id="vOk" class="ok"></div><div id="vErr" class="error"></div></div>`;
  try{await loadBase();vSet(vSub);}catch(e){msg("#vErr","No se han podido cargar los datos: "+e.message,true);}
}
function vSet(s){vSub=s;$("#sc").classList.toggle("active",s==="coger");$("#su").classList.toggle("active",s==="uso");s==="coger"?vCoger():vUso();}
window.vSet=vSet;
function vCoger(){
  const libres=vehiculos.filter(x=>!x.en_uso);
  const yaTengo=vehiculos.find(x=>x.en_uso&&x.conductor_actual_id===worker.id);
  if(yaTengo){$("#vbody").innerHTML=`<div class="gps" style="display:block">Ya tienes un vehículo en uso: <b>${esc(up(yaTengo.nombre))}</b>. Devuélvelo en la pestaña "En uso" antes de coger otro.</div>`;return;}
  $("#vbody").innerHTML=`<label>Vehículo disponible</label><select id="veh"><option value="">SELECCIONA VEHÍCULO</option>${libres.map(x=>`<option value="${x.id}">${esc(up(x.nombre))} — ${esc(up(x.matricula))}</option>`).join("")}</select><button class="primary" onclick="coger()">COGER VEHÍCULO</button><p class="hint" style="margin-top:10px">Quedará registrado a tu nombre (${esc(worker.nombre)}) con la fecha y hora.</p>`;
}
async function coger(){
  const vid=+$("#veh").value;if(!vid){msg("#vErr","Selecciona un vehículo.",true);return;}
  const yaTengo=vehiculos.find(x=>x.en_uso&&x.conductor_actual_id===worker.id);
  if(yaTengo){return msg("#vErr","Ya tienes un vehículo en uso ("+up(yaTengo.nombre)+"). Devuélvelo antes de coger otro.",true);}
  const b=event.target;b.disabled=true;
  const chk=await db.from("vehiculos").select("en_uso,conductor_actual_id").eq("id",vid).single();
  if(!chk.error&&chk.data&&chk.data.en_uso){b.disabled=false;await loadBase();vSet("coger");return msg("#vErr","Ese vehículo ya lo ha cogido otra persona. Actualiza la lista.",true);}
  const r1=await db.from("registros").insert({conductor_id:worker.id,vehiculo_id:vid});
  if(r1.error){b.disabled=false;return msg("#vErr",r1.error.message,true);}
  const r2=await db.from("vehiculos").update({en_uso:true,conductor_actual_id:worker.id}).eq("id",vid);
  b.disabled=false;if(r2.error)return msg("#vErr",r2.error.message,true);
  msg("#vOk","✅ "+up(vehMap[vid].nombre)+" cogido y registrado.");await loadBase();vSet("coger");
}
window.coger=coger;
async function vUso(){
  const enUso=vehiculos.filter(x=>x.en_uso);
  const reg=await db.from("registros").select("vehiculo_id,created_at").is("fecha_devolucion",null).order("created_at",{ascending:false});
  const desde={};if(!reg.error)reg.data.forEach(r=>{if(!(r.vehiculo_id in desde))desde[r.vehiculo_id]=r.created_at;});
  if(!enUso.length){$("#vbody").innerHTML='<p class="empty">No hay vehículos en uso ahora mismo.</p>';return;}
  $("#vbody").innerHTML=enUso.map(v=>`<div class="row"><div class="flex"><div><div class="t">${esc(up(v.nombre))} <span class="badge b-veh">${esc(up(v.matricula))}</span></div><div class="m">Conductor: ${esc(condMap[v.conductor_actual_id]||"—")}${desde[v.id]?" · desde "+fmt(desde[v.id]):""}</div></div><button class="rowbtn grn" onclick="devolver(${v.id})">Devolver</button></div></div>`).join("");
}
async function devolver(vid){
  const r1=await db.from("registros").update({fecha_devolucion:new Date().toISOString()}).eq("vehiculo_id",vid).is("fecha_devolucion",null);
  if(r1.error)return msg("#vErr",r1.error.message,true);
  const r2=await db.from("vehiculos").update({en_uso:false,conductor_actual_id:null}).eq("id",vid);
  if(r2.error)return msg("#vErr",r2.error.message,true);
  msg("#vOk","✅ "+(vehMap[vid]?up(vehMap[vid].nombre):"Vehículo")+" devuelto.");await loadBase();vSet("uso");
}
window.devolver=devolver;

/* FICHAJE */
function pFic(){
  $("#app").innerHTML=`<div class="card"><h2>Fichaje</h2><p class="hint">${esc(worker.nombre)} — pulsa entrada o salida. Al fichar se usa tu ubicación para detectar Taller u obra.</p><div class="btnrow"><button class="b-entrada" onclick="fichar('entrada')">ENTRADA</button><button class="b-salida" onclick="fichar('salida')">SALIDA</button></div><div id="gps" class="gps" style="display:none"></div><div id="fOk" class="ok"></div><div id="fErr" class="error"></div></div><div class="card"><h2>Mis últimos fichajes</h2><div id="misFic"><p class="empty">Cargando…</p></div></div>`;
  if(!zonas.length)loadBase().catch(()=>{});
  loadMisFichajes();
}
async function fichar(tipo){
  const g=$("#gps");g.style.display="block";g.textContent="📍 Obteniendo ubicación…";
  disableFic(true);
  if(!zonas.length){try{await loadBase();}catch(e){}}
  const pos=await getPos();
  let lugar=null;
  if(pos)lugar=resolverZona(pos.lat,pos.lng);
  g.textContent=pos?(lugar?("📍 "+lugar):("📍 Ubicación registrada (±"+pos.precision_m+" m)")):"📍 Sin ubicación (se ficha igualmente)";
  const rec={trabajador_id:worker.id,tipo};
  if(pos){rec.lat=pos.lat;rec.lng=pos.lng;rec.precision_m=pos.precision_m;}
  if(lugar)rec.lugar=lugar;
  const {error}=await db.from("fichajes").insert(rec);
  disableFic(false);
  if(error)return msg("#fErr",error.message,true);
  msg("#fOk","✅ "+(tipo==="entrada"?"Entrada":"Salida")+" registrada"+(lugar?" en "+lugar:""));
  loadMisFichajes();
}
window.fichar=fichar;
function disableFic(v){const a=document.querySelector(".b-entrada"),b=document.querySelector(".b-salida");if(a)a.disabled=v;if(b)b.disabled=v;}
function fLugar(f){return f.lugar?('🏭 '+esc(f.lugar)):(f.lat?('📍 '+f.lat.toFixed(5)+', '+f.lng.toFixed(5)+' · <a class="maps" target="_blank" href="https://maps.google.com/?q='+f.lat+','+f.lng+'">ver mapa</a>'):'Sin ubicación');}
async function loadMisFichajes(){
  const {data,error}=await db.from("fichajes").select("tipo,lat,lng,precision_m,lugar,created_at").eq("trabajador_id",worker.id).order("created_at",{ascending:false}).limit(30);
  if(error){$("#misFic").innerHTML='<p class="empty">'+esc(error.message)+'</p>';return;}
  if(!data.length){$("#misFic").innerHTML='<p class="empty">Aún no tienes fichajes.</p>';return;}
  $("#misFic").innerHTML=data.map(f=>`<div class="row"><div class="t">${f.tipo==="entrada"?'Entrada <span class="badge b-in">IN</span>':'Salida <span class="badge b-out">OUT</span>'}</div><div class="m">${fLugar(f)}</div><div class="d">${fmt(f.created_at)}</div></div>`).join("");
}

/* HERRAMIENTAS (personal) */
let herrList=[], hSub="almacen", repairId=null;
function obraOpts(){return obras.map(o=>{const t=esc(o.codigo+" · "+o.nombre);return `<option value="${t}">${t}</option>`;}).join("");}
async function pHerr(){
  await loadBase().catch(()=>{});
  $("#app").innerHTML=`<div class="card"><h2>Herramientas</h2><div class="subtabs"><button id="ha" onclick="hSet('almacen')">Almacén</button><button id="ho" onclick="hSet('obra')">En obra</button><button id="hr" onclick="hSet('reparacion')">Reparación</button></div><div id="hobrawrap" style="display:none"><label>Obra (obligatorio para coger)</label><select id="obra"><option value="">— Selecciona obra —</option><option value="Taller">Taller</option>${obraOpts()}</select></div><input id="hfil" style="margin-top:10px" placeholder="Buscar por nombre, código, marca…" oninput="renderHerr()"><div id="hbody"><p class="empty">Cargando…</p></div><div id="hOk" class="ok"></div><div id="hErr" class="error"></div></div>`;
  await refreshHerr();hSet(hSub);
}
function hSet(s){hSub=s;repairId=null;const map={almacen:"ha",obra:"ho",reparacion:"hr"};["ha","ho","hr"].forEach(id=>{const b=$("#"+id);if(b)b.classList.toggle("active",id===map[s]);});renderHerr();}
window.hSet=hSet;
function setRepair(id){repairId=id;renderHerr();}
window.setRepair=setRepair;
async function refreshHerr(){const {data,error}=await db.from("herramientas").select("*").order("nombre");if(error){$("#hbody").innerHTML='<p class="empty">'+esc(error.message)+'</p>';return;}herrList=data;renderHerr();}
function estBadge(e){return e==="disponible"?'<span class="badge b-ok">Disponible</span>':e==="en_uso"?'<span class="badge b-use">En uso</span>':e==="reparacion"?'<span class="badge b-rep">Reparación</span>':'<span class="badge b-rep">Baja</span>';}
function hMeta(h){return `<div class="m">${esc(h.codigo||"")}${h.marca?" · "+esc(h.marca):""}${h.categoria?" · "+esc(h.categoria):""}</div>`;}
function repairForm(id){return `<div style="margin-top:9px"><input id="rep${id}" placeholder="Motivo del fallo (obligatorio, ej. no arranca)" style="font-size:14px;padding:11px"><div style="display:flex;gap:8px;margin-top:8px"><button class="rowbtn" style="flex:1" onclick="setRepair(null)">Cancelar</button><button class="rowbtn" style="flex:1;background:var(--red);color:#fff" onclick="reportAveria(${id})">Enviar a reparación</button></div></div>`;}
function renderHerr(){
  const obw=$("#hobrawrap");if(obw)obw.style.display=hSub==="almacen"?"block":"none";
  const q=($("#hfil")?.value||"").toLowerCase();
  const match=h=>!q||((h.nombre+" "+(h.codigo||"")+" "+(h.marca||"")+" "+(h.categoria||"")).toLowerCase().includes(q));
  const body=$("#hbody");if(!body)return;
  if(hSub==="almacen"){
    const list=herrList.filter(h=>h.estado==="disponible").filter(match);
    body.innerHTML=list.length?(`<p class="count">${list.length} en almacén</p>`+list.map(h=>`<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div>${hMeta(h)}${repairId===h.id?repairForm(h.id):`<div style="display:flex;gap:8px"><button class="rowbtn blue" style="flex:1" onclick="cogerHerr(${h.id})">Coger</button><button class="rowbtn" style="flex:1" onclick="setRepair(${h.id})">Avería</button></div>`}</div>`).join("")):'<p class="empty">No hay herramientas en el almacén.</p>';
  }else if(hSub==="obra"){
    const list=herrList.filter(h=>h.estado==="en_uso").filter(match);
    if(!list.length){body.innerHTML='<p class="empty">No hay herramientas en obra ahora mismo.</p>';return;}
    const g={};list.forEach(h=>{const k=h.obra_actual||"Sin obra / Taller";(g[k]=g[k]||[]).push(h);});
    body.innerHTML=Object.keys(g).sort().map(o=>`<p class="count">${esc(o)}</p>`+g[o].map(h=>{const mine=h.responsable_id===worker.id?" (tú)":"";return `<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div>${hMeta(h)}<div class="d">Con: ${esc(condMap[h.responsable_id]||"—")}${mine}</div>${repairId===h.id?repairForm(h.id):`<div style="display:flex;gap:8px"><button class="rowbtn grn" style="flex:1" onclick="devolverHerr(${h.id})">Devolver</button><button class="rowbtn" style="flex:1" onclick="setRepair(${h.id})">Avería</button></div>`}</div>`;}).join("")).join("");
  }else{
    const list=herrList.filter(h=>h.estado==="reparacion").filter(match);
    body.innerHTML=list.length?(`<p class="count">${list.length} en reparación</p>`+list.map(h=>`<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div>${hMeta(h)}${h.nota_reparacion?`<div class="d">⚠️ ${esc(h.nota_reparacion)}</div>`:""}<div class="d">Reportada por: ${esc(condMap[h.responsable_id]||"—")}</div></div>`).join("")):'<p class="empty">No hay herramientas en reparación.</p>';
  }
}
async function cogerHerr(id){const obra=($("#obra")?.value||"").trim();if(!obra){return msg("#hErr","Selecciona una obra (o Taller) antes de coger la herramienta.",true);}const r1=await db.from("herramientas").update({estado:"en_uso",responsable_id:worker.id,obra_actual:obra}).eq("id",id);if(r1.error)return msg("#hErr",r1.error.message,true);await db.from("herramientas_mov").insert({herramienta_id:id,trabajador_id:worker.id,tipo:"coger",obra});msg("#hOk","✅ Herramienta cogida para "+obra+".");await refreshHerr();}
window.cogerHerr=cogerHerr;
async function devolverHerr(id){const r1=await db.from("herramientas").update({estado:"disponible",responsable_id:null,obra_actual:null}).eq("id",id);if(r1.error)return msg("#hErr",r1.error.message,true);await db.from("herramientas_mov").insert({herramienta_id:id,trabajador_id:worker.id,tipo:"devolver"});msg("#hOk","✅ Herramienta devuelta.");await refreshHerr();}
window.devolverHerr=devolverHerr;
async function reportAveria(id){const nota=($("#rep"+id)?.value||"").trim();if(!nota){return msg("#hErr","Explica el motivo del fallo antes de enviar a reparación.",true);}const r1=await db.from("herramientas").update({estado:"reparacion",responsable_id:worker.id,obra_actual:null,nota_reparacion:nota}).eq("id",id);if(r1.error)return msg("#hErr",r1.error.message,true);await db.from("herramientas_mov").insert({herramienta_id:id,trabajador_id:worker.id,tipo:"averia",nota});repairId=null;msg("#hOk","🔧 Enviada a reparación. Avisado el administrador.");await refreshHerr();}
window.reportAveria=reportAveria;

/* ADMIN */
async function renderAdmin(){
  $("#who").innerHTML=`<b>Administrador</b><button class="linkbtn" onclick="adminLogout()">Cerrar sesión</button>`;
  $("#tabs").innerHTML=`<button data-t="veh" onclick="aGo('veh')">Vehículos</button><button data-t="fic" onclick="aGo('fic')">Fichajes</button><button data-t="herr" onclick="aGo('herr')">Herram.</button>`;
  $("#app").innerHTML='<div class="card"><p class="empty">Cargando…</p></div>';
  try{await loadBase();}catch(e){}
  aGo("veh");
}
function aGo(t){[...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active',b.dataset.t===t));if(t==="veh")aVeh();if(t==="fic")aFic();if(t==="herr")aHerr();}
window.aGo=aGo;
async function aVeh(){
  $("#app").innerHTML=`<div class="card"><h2>Historial de vehículos</h2><p class="hint">Quién ha cogido y devuelto cada vehículo.</p><input id="afil" placeholder="Buscar conductor, vehículo o matrícula" oninput="rVeh()"><div id="avbody"><p class="empty">Cargando…</p></div></div>`;
  const {data,error}=await db.from("registros").select("conductor_id,vehiculo_id,created_at,fecha_devolucion").order("created_at",{ascending:false}).limit(500);
  window._regs=error?[]:data;rVeh();
}
function rVeh(){
  const q=($("#afil")?.value||"").toLowerCase();
  const rows=(window._regs||[]).map(r=>{const c=condMap[r.conductor_id]||"?",v=vehMap[r.vehiculo_id];return {c,vn:v?up(v.nombre):"veh #"+r.vehiculo_id,mat:v?up(v.matricula):"",ts:r.created_at,dev:r.fecha_devolucion};}).filter(r=>!q||(r.c+" "+r.vn+" "+r.mat).toLowerCase().includes(q));
  if(!rows.length){$("#avbody").innerHTML='<p class="empty">Sin registros.</p>';return;}
  $("#avbody").innerHTML=rows.map(r=>`<div class="row"><div class="t">${esc(r.c)} → ${esc(r.vn)} <span class="badge b-veh">${esc(r.mat)}</span></div><div class="m">Cogido: ${fmt(r.ts)}</div><div class="d">${r.dev?"Devuelto: "+fmt(r.dev):'<b style="color:var(--amber)">Aún en uso</b>'}</div></div>`).join("");
}
window.rVeh=rVeh;
async function aFic(){
  $("#app").innerHTML=`<div class="card"><h2>Fichajes de todo el personal</h2><input id="affil" placeholder="Buscar trabajador, tipo o lugar" oninput="rFic()"><div id="afbody"><p class="empty">Cargando…</p></div></div>`;
  const {data,error}=await db.from("fichajes").select("trabajador_id,tipo,lat,lng,precision_m,lugar,created_at").order("created_at",{ascending:false}).limit(500);
  window._fics=error?[]:data;rFic();
}
function rFic(){
  const q=(document.getElementById("affil")?.value||"").toLowerCase();
  const rows=(window._fics||[]).map(f=>({n:condMap[f.trabajador_id]||"?",tipo:f.tipo,lat:f.lat,lng:f.lng,lugar:f.lugar,ts:f.created_at})).filter(r=>!q||(r.n+" "+r.tipo+" "+(r.lugar||"")).toLowerCase().includes(q));
  if(!rows.length){$("#afbody").innerHTML='<p class="empty">Sin fichajes.</p>';return;}
  $("#afbody").innerHTML=rows.map(r=>`<div class="row"><div class="t">${esc(r.n)} — ${r.tipo==="entrada"?'Entrada <span class="badge b-in">IN</span>':'Salida <span class="badge b-out">OUT</span>'}${r.lugar?' <span class="badge b-zona">'+esc(r.lugar)+'</span>':''}</div><div class="m">${r.lat?'📍 '+r.lat.toFixed(5)+', '+r.lng.toFixed(5)+(r.lugar?'':' · <a class="maps" target="_blank" href="https://maps.google.com/?q='+r.lat+','+r.lng+'">ver mapa</a>'):'Sin ubicación'}</div><div class="d">${fmt(r.ts)}</div></div>`).join("");
}
window.rFic=rFic;
let aHSub="almacen", admRepairId=null;
function setAdmRepair(id){admRepairId=id;rInv();}
window.setAdmRepair=setAdmRepair;
function admRepairForm(id){return `<div style="margin-top:9px"><input id="arep${id}" placeholder="Motivo del fallo (obligatorio)" style="font-size:14px;padding:11px"><div style="display:flex;gap:8px;margin-top:8px"><button class="rowbtn" style="flex:1" onclick="setAdmRepair(null)">Cancelar</button><button class="rowbtn" style="flex:1;background:var(--red);color:#fff" onclick="admAveria(${id})">Enviar a reparación</button></div></div>`;}
async function aHerr(){
  $("#app").innerHTML=`<div class="card"><h2>Herramientas</h2><input id="ahfil" placeholder="Buscar herramienta" oninput="rInv()"><div class="subtabs" style="margin-top:12px"><button id="ia" onclick="aHSet('almacen')">Almacén</button><button id="io" onclick="aHSet('obra')">Obras</button><button id="ir" onclick="aHSet('reparacion')">Reparación</button><button id="ib" onclick="aHSet('baja')">Baja</button></div><div id="ahbody"><p class="empty">Cargando…</p></div><div id="hOk" class="ok"></div><div id="hErr" class="error"></div></div><div class="card"><h2>Auditoría de movimientos</h2><div id="amov"><p class="empty">Cargando…</p></div></div>`;
  const [inv,mov]=await Promise.all([db.from("herramientas").select("*").order("nombre"),db.from("herramientas_mov").select("herramienta_id,trabajador_id,tipo,obra,nota,created_at").order("created_at",{ascending:false}).limit(200)]);
  window._inv=inv.error?[]:inv.data;window._hmap={};window._inv.forEach(h=>window._hmap[h.id]=h.nombre);aHSet(aHSub);
  const m=mov.error?[]:mov.data;
  $("#amov").innerHTML=m.length?m.map(x=>`<div class="row"><div class="t">${esc(up(window._hmap[x.herramienta_id]||"herr #"+x.herramienta_id))} — ${movLabel(x.tipo)}</div><div class="m">${esc(condMap[x.trabajador_id]||"—")}${x.obra?" · "+esc(x.obra):""}${x.nota?" · "+esc(x.nota):""}</div><div class="d">${fmt(x.created_at)}</div></div>`).join(""):'<p class="empty">Sin movimientos todavía.</p>';
}
function aHSet(s){aHSub=s;admRepairId=null;const map={almacen:"ia",obra:"io",reparacion:"ir",baja:"ib"};["ia","io","ir","ib"].forEach(id=>{const b=$("#"+id);if(b)b.classList.toggle("active",id===map[s]);});rInv();}
window.aHSet=aHSet;
function movLabel(t){return t==="coger"?"Cogida":t==="devolver"?"Devuelta":t==="averia"?"Enviada a reparación":t==="reparada"?"Reparada":t==="baja"?"Dada de baja":esc(t);}
async function refreshInv(){const inv=await db.from("herramientas").select("*").order("nombre");window._inv=inv.error?[]:inv.data;window._hmap={};window._inv.forEach(h=>window._hmap[h.id]=h.nombre);rInv();}
window.refreshInv=refreshInv;
function rInv(){
  const body=$("#ahbody");if(!body)return;
  const q=(document.getElementById("ahfil")?.value||"").toLowerCase();
  const match=h=>!q||((h.nombre+" "+(h.codigo||"")+" "+(h.marca||"")).toLowerCase().includes(q));
  let list=(window._inv||[]).filter(match);
  if(aHSub==="almacen"){
    list=list.filter(h=>h.estado==="disponible");
    body.innerHTML=`<p class="count">${list.length} en almacén</p>`+(list.length?list.map(h=>`<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div><div class="m">${esc(h.codigo||"")}${h.marca?" · "+esc(h.marca):""}${h.stock>1?" · stock "+h.stock:""}</div>${admRepairId===h.id?admRepairForm(h.id):`<button class="rowbtn" style="background:var(--red);color:#fff" onclick="setAdmRepair(${h.id})">Enviar a reparación</button>`}</div>`).join(""):'<p class="empty">Almacén vacío.</p>');
  }else if(aHSub==="obra"){
    list=list.filter(h=>h.estado==="en_uso");
    if(!list.length){body.innerHTML='<p class="empty">Ninguna herramienta en obra.</p>';return;}
    const g={};list.forEach(h=>{const k=h.obra_actual||"Sin obra / Taller";(g[k]=g[k]||[]).push(h);});
    body.innerHTML=Object.keys(g).sort().map(o=>`<p class="count">${esc(o)}</p>`+g[o].map(h=>`<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div><div class="m">${esc(h.codigo||"")}${h.marca?" · "+esc(h.marca):""}</div><div class="d">Con: ${esc(condMap[h.responsable_id]||"—")}</div><button class="rowbtn grn" onclick="admDevolver(${h.id})">Devolver al almacén</button></div>`).join("")).join("");
  }else if(aHSub==="reparacion"){
    list=list.filter(h=>h.estado==="reparacion");
    body.innerHTML=`<p class="count">${list.length} en reparación</p>`+(list.length?list.map(h=>`<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div><div class="m">${esc(h.codigo||"")}${h.marca?" · "+esc(h.marca):""}</div>${h.nota_reparacion?`<div class="d">⚠️ ${esc(h.nota_reparacion)}</div>`:""}<div class="d">Reportada por: ${esc(condMap[h.responsable_id]||"—")}</div><div style="display:flex;gap:8px"><button class="rowbtn grn" style="flex:1" onclick="admReparada(${h.id})">Marcar reparada</button><button class="rowbtn" style="flex:1" onclick="admBaja(${h.id})">Dar de baja</button></div></div>`).join(""):'<p class="empty">Nada en reparación.</p>');
  }else{
    list=list.filter(h=>h.estado==="baja");
    body.innerHTML=`<p class="count">${list.length} de baja</p>`+(list.length?list.map(h=>`<div class="row"><div class="t">${esc(up(h.nombre))} ${estBadge(h.estado)}</div><div class="m">${esc(h.codigo||"")}${h.marca?" · "+esc(h.marca):""}</div><button class="rowbtn" onclick="admReparada(${h.id})">Reactivar al almacén</button></div>`).join(""):'<p class="empty">Ninguna herramienta de baja.</p>');
  }
}
window.rInv=rInv;
async function admReparada(id){const r=await db.from("herramientas").update({estado:"disponible",responsable_id:null,obra_actual:null,nota_reparacion:null}).eq("id",id);if(r.error)return msg("#hErr",r.error.message,true);await db.from("herramientas_mov").insert({herramienta_id:id,tipo:"reparada"});msg("#hOk","✅ Reparada y de vuelta al almacén.");await refreshInv();}
window.admReparada=admReparada;
async function admBaja(id){const r=await db.from("herramientas").update({estado:"baja",responsable_id:null,obra_actual:null,nota_reparacion:null}).eq("id",id);if(r.error)return msg("#hErr",r.error.message,true);await db.from("herramientas_mov").insert({herramienta_id:id,tipo:"baja"});msg("#hOk","Herramienta dada de baja.");await refreshInv();}
window.admBaja=admBaja;
async function admDevolver(id){const r=await db.from("herramientas").update({estado:"disponible",responsable_id:null,obra_actual:null}).eq("id",id);if(r.error)return msg("#hErr",r.error.message,true);await db.from("herramientas_mov").insert({herramienta_id:id,tipo:"devolver"});msg("#hOk","✅ Devuelta al almacén.");await refreshInv();}
window.admDevolver=admDevolver;
async function admAveria(id){const nota=($("#arep"+id)?.value||"").trim();if(!nota){return msg("#hErr","Explica el motivo antes de enviar a reparación.",true);}const r=await db.from("herramientas").update({estado:"reparacion",responsable_id:null,obra_actual:null,nota_reparacion:nota}).eq("id",id);if(r.error)return msg("#hErr",r.error.message,true);await db.from("herramientas_mov").insert({herramienta_id:id,tipo:"averia",nota});admRepairId=null;msg("#hOk","🔧 Enviada a reparación.");await refreshInv();}
window.admAveria=admAveria;

function msg(sel,text,isErr){const e=$(sel);if(!e)return;e.textContent=text;e.style.display="block";if(!isErr)setTimeout(()=>e.style.display="none",2600);}

boot().catch(e=>renderCenter("Error",e.message,true));
</script>
