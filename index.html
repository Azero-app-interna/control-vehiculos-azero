<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12233b">
<link rel="manifest" href="manifest.json">
<title>AZERO — Control interno</title>
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#16202c; --muted:#69747f;
  --line:#e5e9ee; --brand:#12233b; --accent:#1769e0; --accent2:#0f57c2;
  --green:#0f7a3d; --red:#c0392b; --amber:#b7791f;
  --radius:16px; --shadow:0 6px 22px #0b213a12;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:auto;padding:0 16px 40px}

/* ---------- App bar ---------- */
.appbar{background:var(--brand);color:#fff;margin:0 -16px 0;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.logoimg{height:34px;width:auto;display:block}
.who{margin-left:auto;text-align:right;font-size:13px;line-height:1.25}
.who b{display:block;font-size:14px}
.who span{color:#9fb4cf;font-size:11px}
.linkbtn{background:none;border:0;color:#9fb4cf;font-size:12px;cursor:pointer;padding:0;margin-top:2px;text-decoration:underline}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;background:var(--brand);margin:0 -16px;padding:0 16px 12px;position:sticky;top:66px;z-index:19}
.tabs button{flex:1;border:0;border-radius:11px;padding:11px 6px;font-size:14px;font-weight:700;background:#ffffff1a;color:#cdd8e6;cursor:pointer}
.tabs button.active{background:#fff;color:var(--brand)}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin:16px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 8px}
label{font-weight:700;display:block;margin:14px 0 7px;font-size:14px}
select,input{width:100%;padding:14px;border:1px solid #d5dbe2;border-radius:12px;background:#fff;font-size:16px;color:var(--ink)}
button.primary,button.big{width:100%;border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:800;background:var(--accent);color:#fff;margin-top:16px;cursor:pointer}
button.primary:active{background:var(--accent2)}
button:disabled{opacity:.5}
.subtabs{display:flex;gap:8px;margin-bottom:6px}
.subtabs button{flex:1;border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:700;background:#eef2f7;color:#38424e;cursor:pointer}
.subtabs button.active{background:var(--brand);color:#fff}

/* ---------- Lists ---------- */
.row{padding:13px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:700}
.row .m{color:var(--muted);font-size:13px;margin-top:2px}
.row .d{color:#94a0ac;font-size:12px;margin-top:2px}
.badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:800;margin-left:4px;vertical-align:middle}
.b-ok{background:#e6f5ec;color:var(--green)}
.b-use{background:#fdeede;color:var(--amber)}
.b-rep{background:#fdeaea;color:var(--red)}
.b-in{background:#e6f5ec;color:var(--green)}
.b-out{background:#fdeaea;color:var(--red)}
.b-veh{background:#e7effc;color:var(--accent)}
.rowbtn{width:auto;padding:8px 15px;font-size:13px;font-weight:700;border:0;border-radius:10px;background:#eef2f7;color:#25303c;cursor:pointer;margin-top:9px}
.rowbtn.blue{background:var(--accent);color:#fff}
.rowbtn.grn{background:var(--green);color:#fff}
.flex{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow button{flex:1;border:0;border-radius:13px;padding:16px;font-size:17px;font-weight:800;color:#fff;cursor:pointer}
.b-entrada{background:var(--green)}
.b-salida{background:var(--red)}

.gps{background:#f2f6fb;border:1px solid #e0e8f1;border-radius:12px;padding:11px;margin-top:12px;font-size:13px;color:#3a4b5c}
.ok{display:none;background:#e6f5ec;color:var(--green);padding:12px;border-radius:11px;margin-top:14px;font-weight:700;font-size:14px}
.error{display:none;background:#fdeaea;color:var(--red);padding:12px;border-radius:11px;margin-top:14px;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.hidden{display:none}
.count{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 4px}
.center{max-width:380px;margin:12vh auto 0;text-align:center}
.center h1{font-size:22px;margin:0 0 6px}
.center p{color:var(--muted);font-size:14px;margin:0 0 18px}
.logolg{height:56px;width:auto;display:block;margin:0 auto 20px}
a.maps{color:var(--accent);text-decoration:none;font-size:12px}
</style>
</head>
<body>
<main>
  <div class="appbar">
    <img id="brandlogo" class="logoimg" alt="AZERO">
    <div class="who" id="who"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
</main>

const db=supabase.createClient(SB_URL,SB_KEY);

/* =====================================================================
   ESTADO / UTILIDADES
   ===================================================================== */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(ts){return ts?new Date(ts).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}):"";}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

let worker=null, isAdmin=false;
let vehiculos=[], condMap={}, vehMap={}, obras=[], lastPos=null;
const params=new URLSearchParams(location.search);
const bl=document.getElementById("brandlogo"); if(bl) bl.src=LOGO;

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function boot(){
  let token=params.get("u");
  if(token){ lsSet("azero_token",token); }
  else if(!params.has("admin")){ token=lsGet("azero_token"); }

  if(params.has("admin")){ return startAdmin(); }

  if(token){
    const {data,error}=await db.from("conductores").select("id,nombre").eq("token",token).limit(1);
    if(!error && data && data.length){ worker=data[0]; return startPersonal(); }
    lsDel("azero_token");
    return renderCenter("Enlace no válido","Este enlace personal no es correcto. Pide a administración que te envíe el tuyo.",true);
  }
  startAdmin();
}

/* =====================================================================
   PANTALLAS "CENTRO"
   ===================================================================== */
function renderCenter(title,text,showAdminLink){
  $("#tabs").innerHTML=""; $("#who").innerHTML="";
  $("#app").innerHTML=`
    <div class="center">
      <img class="logolg" src="${LOGO}" alt="AZERO">
      <h1>${esc(title)}</h1>
      <p>${esc(text)}</p>
      ${showAdminLink?'<button class="linkbtn" style="color:var(--accent);font-size:14px" onclick="location.search=\'?admin=1\'">Entrar como administrador</button>':''}
    </div>`;
}
function startAdmin(){
  worker=null;
  if(lsGet("azero_admin")==="1"){ isAdmin=true; return renderAdmin(); }
  $("#tabs").innerHTML=""; $("#who").innerHTML="";
  $("#app").innerHTML=`
    <div class="center">
      <img class="logolg" src="${LOGO}" alt="AZERO">
      <h1>Administrador</h1>
      <p>Introduce la contraseña para ver los registros.</p>
      <input id="pass" type="password" placeholder="Contraseña" autocomplete="off">
      <button class="primary" onclick="tryAdmin()">Entrar</button>
      <div id="passErr" class="error"></div>
    </div>`;
  const i=$("#pass"); i.addEventListener("keydown",e=>{if(e.key==="Enter")tryAdmin();}); i.focus();
}
function tryAdmin(){
  if($("#pass").value===ADMIN_PASS){ lsSet("azero_admin","1"); isAdmin=true; renderAdmin(); }
  else{ const e=$("#passErr"); e.textContent="Contraseña incorrecta."; e.style.display="block"; }
}
window.tryAdmin=tryAdmin;
function adminLogout(){ lsDel("azero_admin"); location.search=""; }
window.adminLogout=adminLogout;

/* =====================================================================
   CARGA DE DATOS BASE
   ===================================================================== */
async function loadBase(){
  const [v,c,o]=await Promise.all([
    db.from("vehiculos").select("id,nombre,matricula,activo,en_uso,conductor_actual_id").eq("activo",true).order("nombre"),
    db.from("conductores").select("id,nombre").order("nombre"),
    db.from("obras").select("id,codigo,nombre").eq("activa",true).order("codigo")
  ]);
  if(v.error) throw v.error;
  if(c.error) throw c.error;
  vehiculos=v.data;
  condMap={}; c.data.forEach(x=>condMap[x.id]=x.nombre);
  vehMap={}; vehiculos.forEach(x=>vehMap[x.id]=x);
  obras = o.error?[]:o.data;
}

/* =====================================================================
   MODO PERSONAL
   ===================================================================== */
function startPersonal(){
  $("#who").innerHTML=`<b>${esc(worker.nombre)}</b><span>Tu acceso personal</span>`;
  $("#tabs").innerHTML=`
    <button data-t="veh" onclick="pGo('veh')">Vehículos</button>
    <button data-t="fic" onclick="pGo('fic')">Fichaje</button>
    <button data-t="herr" onclick="pGo('herr')">Herramientas</button>`;
  pGo("veh");
}
function pGo(t){ [...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  if(t==="veh")pVeh(); if(t==="fic")pFic(); if(t==="herr")pHerr(); }
window.pGo=pGo;

/* --- Vehículos --- */
let vSub="coger";
async function pVeh(){
  $("#app").innerHTML=`
    <div class="card">
      <div class="subtabs">
        <button id="sc" class="${vSub==='coger'?'active':''}" onclick="vSet('coger')">Coger</button>
        <button id="su" class="${vSub==='uso'?'active':''}" onclick="vSet('uso')">En uso</button>
      </div>
      <div id="vbody"><p class="empty">Cargando...</p></div>
      <div id="vOk" class="ok"></div><div id="vErr" class="error"></div>
    </div>`;
  try{ await loadBase(); vSet(vSub); }
  catch(e){ msg("#vErr","No se han podido cargar los datos: "+e.message,true); }
}
function vSet(s){ vSub=s; $("#sc").classList.toggle("active",s==="coger"); $("#su").classList.toggle("active",s==="uso");
  s==="coger"?vCoger():vUso(); }
window.vSet=vSet;
function vCoger(){
  const libres=vehiculos.filter(x=>!x.en_uso);
  $("#vbody").innerHTML=`
    <label>Vehículo disponible</label>
    <select id="veh"><option value="">Selecciona vehículo</option>
      ${libres.map(x=>`<option value="${x.id}">${esc(x.nombre)} — ${esc(x.matricula)}</option>`).join("")}</select>
    <button class="primary" onclick="coger()">COGER VEHÍCULO</button>
    <p class="hint" style="margin-top:10px">Quedará registrado a tu nombre (${esc(worker.nombre)}) con la fecha y hora.</p>`;
}
async function coger(){
  const vid=+$("#veh").value; if(!vid){msg("#vErr","Selecciona un vehículo.",true);return;}
  const b=event.target; b.disabled=true;
  const r1=await db.from("registros").insert({conductor_id:worker.id,vehiculo_id:vid});
  if(r1.error){b.disabled=false;return msg("#vErr",r1.error.message,true);}
  const r2=await db.from("vehiculos").update({en_uso:true,conductor_actual_id:worker.id}).eq("id",vid);
  b.disabled=false;
  if(r2.error)return msg("#vErr",r2.error.message,true);
  msg("#vOk","✅ "+vehMap[vid].nombre+" cogido y registrado.");
  await loadBase(); vSet("coger");
}
window.coger=coger;
async function vUso(){
  const enUso=vehiculos.filter(x=>x.en_uso);
  const reg=await db.from("registros").select("vehiculo_id,created_at").is("fecha_devolucion",null).order("created_at",{ascending:false});
  const desde={}; if(!reg.error)reg.data.forEach(r=>{if(!(r.vehiculo_id in desde))desde[r.vehiculo_id]=r.created_at;});
  if(!enUso.length){$("#vbody").innerHTML='<p class="empty">No hay vehículos en uso ahora mismo.</p>';return;}
  $("#vbody").innerHTML=enUso.map(v=>`
    <div class="row"><div class="flex"><div>
      <div class="t">${esc(v.nombre)} <span class="badge b-veh">${esc(v.matricula)}</span></div>
      <div class="m">Conductor: ${esc(condMap[v.conductor_actual_id]||"—")}${desde[v.id]?" · desde "+fmt(desde[v.id]):""}</div>
    </div><button class="rowbtn grn" onclick="devolver(${v.id})">Devolver</button></div></div>`).join("");
}
async function devolver(vid){
  const r1=await db.from("registros").update({fecha_devolucion:new Date().toISOString()}).eq("vehiculo_id",vid).is("fecha_devolucion",null);
  if(r1.error)return msg("#vErr",r1.error.message,true);
  const r2=await db.from("vehiculos").update({en_uso:false,conductor_actual_id:null}).eq("id",vid);
  if(r2.error)return msg("#vErr",r2.error.message,true);
  msg("#vOk","✅ "+(vehMap[vid]?vehMap[vid].nombre:"Vehículo")+" devuelto.");
  await loadBase(); vSet("uso");
}
window.devolver=devolver;

/* --- Fichaje --- */
function pFic(){
  $("#app").innerHTML=`
    <div class="card">
      <h2>Fichaje</h2>
      <p class="hint">${esc(worker.nombre)} — pulsa entrada o salida.</p>
      <div id="gps" class="gps">📍 Preparando ubicación…</div>
      <button class="rowbtn" style="margin-top:10px" onclick="captureGps()">Actualizar ubicación</button>
      <div class="btnrow">
        <button class="b-entrada" onclick="fichar('entrada')">ENTRADA</button>
        <button class="b-salida" onclick="fichar('salida')">SALIDA</button>
      </div>
      <div id="fOk" class="ok"></div><div id="fErr" class="error"></div>
    </div>
    <div class="card"><h2>Mis últimos fichajes</h2><div id="misFic"><p class="empty">Cargando…</p></div></div>`;
  if(!lastPos)captureGps();
  loadMisFichajes();
}
function captureGps(){
  if(!navigator.geolocation){$("#gps").textContent="📍 Este dispositivo no permite ubicación.";return;}
  $("#gps").textContent="📍 Obteniendo ubicación…";
  navigator.geolocation.getCurrentPosition(
    p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude,precision_m:Math.round(p.coords.accuracy)};
        $("#gps").textContent="📍 Ubicación lista (±"+lastPos.precision_m+" m)";},
    e=>{lastPos=null;$("#gps").textContent="📍 Sin ubicación ("+e.message+"). Puedes fichar igualmente.";},
    {enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
window.captureGps=captureGps;
async function fichar(tipo){
  const rec={trabajador_id:worker.id,tipo};
  if(lastPos){rec.lat=lastPos.lat;rec.lng=lastPos.lng;rec.precision_m=lastPos.precision_m;}
  const {error}=await db.from("fichajes").insert(rec);
  if(error)return msg("#fErr",error.message,true);
  msg("#fOk","✅ "+(tipo==="entrada"?"Entrada":"Salida")+" registrada"+(lastPos?"":" (sin ubicación)"));
  loadMisFichajes();
}
window.fichar=fichar;
async function loadMisFichajes(){
  const {data,error}=await db.from("fichajes").select("tipo,lat,lng,precision_m,created_at").eq("trabajador_id",worker.id).order("created_at",{ascending:false}).limit(30);
  if(error){$("#misFic").innerHTML='<p class="empty">'+esc(error.message)+'</p>';return;}
  if(!data.length){$("#misFic").innerHTML='<p class="empty">Aún no tienes fichajes.</p>';return;}
  $("#misFic").innerHTML=data.map(f=>`
    <div class="row"><div class="t">${f.tipo==="entrada"?'Entrada <span class="badge b-in">IN</span>':'Salida <span class="badge b-out">OUT</span>'}</div>
    <div class="m">${f.lat?'📍 '+f.lat.toFixed(5)+', '+f.lng.toFixed(5)+' ':'Sin ubicación '}${f.lat?`· <a class="maps" target="_blank" href="https://maps.google.com/?q=${f.lat},${f.lng}">ver mapa</a>`:''}</div>
    <div class="d">${fmt(f.created_at)}</div></div>`).join("");
}

/* --- Herramientas --- */
async function pHerr(){
  await loadBase().catch(()=>{});
  const obraOpts=obras.map(o=>{const t=esc(o.codigo+" · "+o.nombre);return `<option value="${t}">${t}</option>`;}).join("");
  $("#app").innerHTML=`
    <div class="card">
      <h2>Herramientas</h2>
      <p class="hint">Coge o devuelve herramientas. Todo queda registrado a tu nombre.</p>
      <label>Obra (para 'Coger')</label>
      <select id="obra"><option value="">Sin obra / Taller</option>${obraOpts}</select>
      <input id="hfil" style="margin-top:10px" placeholder="Buscar por nombre, código, marca…" oninput="renderHerr()">
      <div id="hbody"><p class="empty">Cargando…</p></div>
      <div id="hOk" class="ok"></div><div id="hErr" class="error"></div>
    </div>`;
  await refreshHerr();
}
let herrList=[];
async function refreshHerr(){
  const {data,error}=await db.from("herramientas").select("*").order("nombre");
  if(error){$("#hbody").innerHTML='<p class="empty">'+esc(error.message)+'</p>';return;}
  herrList=data; renderHerr();
}
function estBadge(e){return e==="disponible"?'<span class="badge b-ok">Disponible</span>':e==="en_uso"?'<span class="badge b-use">En uso</span>':e==="reparacion"?'<span class="badge b-rep">Reparación</span>':'<span class="badge b-rep">Baja</span>';}
function renderHerr(){
  const q=($("#hfil")?.value||"").toLowerCase();
  const list=herrList.filter(h=>!q||((h.nombre+" "+(h.codigo||"")+" "+(h.marca||"")+" "+(h.categoria||"")).toLowerCase().includes(q)));
  if(!list.length){$("#hbody").innerHTML='<p class="empty">Sin resultados.</p>';return;}
  $("#hbody").innerHTML=list.map(h=>{
    let action="";
    if(h.estado==="disponible") action=`<button class="rowbtn blue" onclick="cogerHerr(${h.id})">Coger</button>`;
    else if(h.estado==="en_uso") action=`<button class="rowbtn grn" onclick="devolverHerr(${h.id})">Devolver</button>`;
    const mine=h.responsable_id===worker.id?" (tú)":"";
    return `<div class="row"><div class="flex"><div>
      <div class="t">${esc(h.nombre)} ${estBadge(h.estado)}</div>
      <div class="m">${esc(h.codigo||"")}${h.marca?" · "+esc(h.marca):""}${h.categoria?" · "+esc(h.categoria):""}</div>
      ${h.estado==="en_uso"?`<div class="d">Con: ${esc(condMap[h.responsable_id]||"—")}${mine}${h.obra_actual?" · "+esc(h.obra_actual):""}</div>`:""}
    </div><div>${action}</div></div></div>`;
  }).join("");
}
async function cogerHerr(id){
  const obra=$("#obra")?.value||null;
  const r1=await db.from("herramientas").update({estado:"en_uso",responsable_id:worker.id,obra_actual:obra}).eq("id",id);
  if(r1.error)return msg("#hErr",r1.error.message,true);
  await db.from("herramientas_mov").insert({herramienta_id:id,trabajador_id:worker.id,tipo:"coger",obra});
  msg("#hOk","✅ Herramienta cogida.");
  await refreshHerr();
}
window.cogerHerr=cogerHerr;
async function devolverHerr(id){
  const r1=await db.from("herramientas").update({estado:"disponible",responsable_id:null,obra_actual:null}).eq("id",id);
  if(r1.error)return msg("#hErr",r1.error.message,true);
  await db.from("herramientas_mov").insert({herramienta_id:id,trabajador_id:worker.id,tipo:"devolver"});
  msg("#hOk","✅ Herramienta devuelta.");
  await refreshHerr();
}
window.devolverHerr=devolverHerr;

/* =====================================================================
   MODO ADMINISTRADOR
   ===================================================================== */
async function renderAdmin(){
  $("#who").innerHTML=`<b>Administrador</b><button class="linkbtn" onclick="adminLogout()">Cerrar sesión</button>`;
  $("#tabs").innerHTML=`
    <button data-t="veh" onclick="aGo('veh')">Vehículos</button>
    <button data-t="fic" onclick="aGo('fic')">Fichajes</button>
    <button data-t="herr" onclick="aGo('herr')">Herramientas</button>`;
  $("#app").innerHTML='<div class="card"><p class="empty">Cargando…</p></div>';
  try{ await loadBase(); }catch(e){}
  aGo("veh");
}
function aGo(t){ [...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active',b.dataset.t===t));
  if(t==="veh")aVeh(); if(t==="fic")aFic(); if(t==="herr")aHerr(); }
window.aGo=aGo;

async function aVeh(){
  $("#app").innerHTML=`<div class="card"><h2>Historial de vehículos</h2>
    <p class="hint">Quién ha cogido y devuelto cada vehículo.</p>
    <input id="afil" placeholder="Buscar conductor, vehículo o matrícula" oninput="rVeh()">
    <div id="avbody"><p class="empty">Cargando…</p></div></div>`;
  const {data,error}=await db.from("registros").select("conductor_id,vehiculo_id,created_at,fecha_devolucion").order("created_at",{ascending:false}).limit(500);
  window._regs = error?[]:data;
  rVeh();
}
function rVeh(){
  const q=($("#afil")?.value||"").toLowerCase();
  const rows=(window._regs||[]).map(r=>{
    const c=condMap[r.conductor_id]||"?", v=vehMap[r.vehiculo_id];
    return {c,vn:v?v.nombre:"veh #"+r.vehiculo_id,mat:v?v.matricula:"",ts:r.created_at,dev:r.fecha_devolucion};
  }).filter(r=>!q||(r.c+" "+r.vn+" "+r.mat).toLowerCase().includes(q));
  if(!rows.length){$("#avbody").innerHTML='<p class="empty">Sin registros.</p>';return;}
  $("#avbody").innerHTML=rows.map(r=>`<div class="row">
    <div class="t">${esc(r.c)} → ${esc(r.vn)} <span class="badge b-veh">${esc(r.mat)}</span></div>
    <div class="m">Cogido: ${fmt(r.ts)}</div>
    <div class="d">${r.dev?"Devuelto: "+fmt(r.dev):'<b style="color:var(--amber)">Aún en uso</b>'}</div></div>`).join("");
}
window.rVeh=rVeh;

async function aFic(){
  $("#app").innerHTML=`<div class="card"><h2>Fichajes de todo el personal</h2>
    <input id="affil" placeholder="Buscar trabajador o tipo" oninput="rFic()">
    <div id="afbody"><p class="empty">Cargando…</p></div></div>`;
  const {data,error}=await db.from("fichajes").select("trabajador_id,tipo,lat,lng,precision_m,created_at").order("created_at",{ascending:false}).limit(500);
  window._fics = error?[]:data;
  rFic();
}
function rFic(){
  const q=(document.getElementById("affil")?.value||"").toLowerCase();
  const rows=(window._fics||[]).map(f=>({n:condMap[f.trabajador_id]||"?",tipo:f.tipo,lat:f.lat,lng:f.lng,ts:f.created_at}))
    .filter(r=>!q||(r.n+" "+r.tipo).toLowerCase().includes(q));
  if(!rows.length){$("#afbody").innerHTML='<p class="empty">Sin fichajes.</p>';return;}
  $("#afbody").innerHTML=rows.map(r=>`<div class="row">
    <div class="t">${esc(r.n)} — ${r.tipo==="entrada"?'Entrada <span class="badge b-in">IN</span>':'Salida <span class="badge b-out">OUT</span>'}</div>
    <div class="m">${r.lat?'📍 '+r.lat.toFixed(5)+', '+r.lng.toFixed(5)+' · <a class="maps" target="_blank" href="https://maps.google.com/?q='+r.lat+','+r.lng+'">ver mapa</a>':'Sin ubicación'}</div>
    <div class="d">${fmt(r.ts)}</div></div>`).join("");
}
window.rFic=rFic;

async function aHerr(){
  $("#app").innerHTML=`<div class="card"><h2>Inventario de herramientas</h2>
    <input id="ahfil" placeholder="Buscar herramienta" oninput="rInv()">
    <div id="ahbody"><p class="empty">Cargando…</p></div></div>
    <div class="card"><h2>Herramientas por obra</h2><div id="aobra"></div></div>
    <div class="card"><h2>Auditoría de movimientos</h2><div id="amov"><p class="empty">Cargando…</p></div></div>`;
  const [inv,mov]=await Promise.all([
    db.from("herramientas").select("*").order("nombre"),
    db.from("herramientas_mov").select("herramienta_id,trabajador_id,tipo,obra,created_at").order("created_at",{ascending:false}).limit(200)
  ]);
  window._inv=inv.error?[]:inv.data;
  window._hmap={}; window._inv.forEach(h=>window._hmap[h.id]=h.nombre);
  rInv();
  const porObra={};
  window._inv.filter(h=>h.estado==="en_uso"&&h.obra_actual).forEach(h=>{(porObra[h.obra_actual]=porObra[h.obra_actual]||[]).push(h.nombre);});
  const keys=Object.keys(porObra).sort();
  $("#aobra").innerHTML = keys.length? keys.map(o=>`<div class="row"><div class="t">${esc(o)}</div><div class="m">${esc(porObra[o].join(", "))}</div></div>`).join("") : '<p class="empty">Ninguna herramienta asignada a una obra ahora mismo.</p>';
  const m=mov.error?[]:mov.data;
  $("#amov").innerHTML = m.length? m.map(x=>`<div class="row">
    <div class="t">${esc(window._hmap[x.herramienta_id]||"herr #"+x.herramienta_id)} — ${x.tipo==="coger"?"Cogida":x.tipo==="devolver"?"Devuelta":esc(x.tipo)}</div>
    <div class="m">${esc(condMap[x.trabajador_id]||"—")}${x.obra?" · "+esc(x.obra):""}</div>
    <div class="d">${fmt(x.created_at)}</div></div>`).join("") : '<p class="empty">Sin movimientos todavía.</p>';
}
function rInv(){
  const q=(document.getElementById("ahfil")?.value||"").toLowerCase();
  const list=(window._inv||[]).filter(h=>!q||((h.nombre+" "+(h.codigo||"")+" "+(h.marca||"")).toLowerCase().includes(q)));
  const disp=list.filter(h=>h.estado==="disponible").length;
  $("#ahbody").innerHTML=`<p class="count">${list.length} herramientas · ${disp} disponibles</p>`+list.map(h=>`<div class="row">
    <div class="t">${esc(h.nombre)} ${estBadge(h.estado)}</div>
    <div class="m">${esc(h.codigo||"")}${h.marca?" · "+esc(h.marca):""}${h.stock>1?" · stock "+h.stock:""}</div>
    ${h.estado==="en_uso"?`<div class="d">Con: ${esc(condMap[h.responsable_id]||"—")}${h.obra_actual?" · "+esc(h.obra_actual):""}</div>`:""}</div>`).join("");
}
window.rInv=rInv;

/* =====================================================================
   HELPERS
   ===================================================================== */
function msg(sel,text,isErr){const e=$(sel);if(!e)return;e.textContent=text;e.style.display="block";if(!isErr)setTimeout(()=>e.style.display="none",2400);}

boot().catch(e=>renderCenter("Error",e.message,true));
</script>
</body>
